<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="description" content="Нежный кулич на твороге и сметане с клюквой и шоколадом — пасхальный рецепт">
    <meta name="theme-color" content="#F5D97F">
    <title>🐣 Пасхальный кулич | Нежный творожный</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pastel-yellow: #FFF8E7;
            --pastel-yellow-dark: #F5E9C8;
            --egg-white: #FFFFFF;
            --butter-yellow: #F5D97F;
            --chocolate-brown: #6B3A2A;
            --purple-spring: #B886B8;
            --green-spring: #A8C686;
            --text-dark: #4A3728;
            --text-soft: #7A6B5A;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 35px rgba(0,0,0,0.1);
            --radius-card: 28px;
        }

        body {
            background: linear-gradient(145deg, var(--pastel-yellow) 0%, var(--pastel-yellow-dark) 100%);
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            position: relative;
        }

        /* Декоративные пасхальные элементы */
        body::before {
            content: "🐣 🥚 🐰 🕊️ 🌸";
            font-size: 14vw;
            position: fixed;
            bottom: -5vh;
            right: -5vw;
            opacity: 0.06;
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        body::after {
            content: "✝️ 🌿";
            font-size: 10vw;
            position: fixed;
            top: 10vh;
            left: -3vw;
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 860px;
            margin: 0 auto;
            padding: 24px 20px;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .app { padding: 36px; }
        }

        /* Хедер */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(245, 217, 127, 0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 38px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.08));
            animation: gentleHop 3s infinite ease-in-out;
        }

        @keyframes gentleHop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--chocolate-brown);
        }

        .logo-text span {
            color: var(--butter-yellow);
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--butter-yellow);
            border-radius: 40px;
            padding: 8px 18px;
            color: var(--chocolate-brown);
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }

        .theme-btn:hover {
            background: var(--butter-yellow);
            color: white;
        }

        /* Герой */
        .hero {
            text-align: center;
            margin-bottom: 28px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 700;
            color: var(--chocolate-brown);
        }

        .hero h1 span {
            color: var(--butter-yellow);
        }

        @media (min-width: 600px) {
            .hero h1 { font-size: 58px; }
        }

        .hero-sub {
            font-size: 16px;
            color: var(--text-soft);
            margin-top: 8px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(184, 134, 184, 0.15);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            margin-top: 12px;
            color: var(--purple-spring);
        }

        /* Кнопка старта */
        .start-btn {
            background: linear-gradient(105deg, var(--butter-yellow), #E8C86A);
            border: none;
            border-radius: 60px;
            padding: 16px 28px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--chocolate-brown);
            font-weight: 700;
            font-size: 20px;
            cursor: pointer;
            margin-bottom: 28px;
            font-family: 'Playfair Display', serif;
            box-shadow: 0 8px 20px rgba(245, 217, 127, 0.4);
            transition: 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(245, 217, 127, 0.5);
        }

        /* Прогресс */
        .progress-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(245, 217, 127, 0.3);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .progress-percent {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--chocolate-brown), var(--butter-yellow));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .progress-bar-bg {
            height: 10px;
            background: rgba(184, 134, 184, 0.15);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--butter-yellow), var(--purple-spring));
            border-radius: 20px;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        /* Ингредиенты */
        .ingredients-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-card);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(245, 217, 127, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px dashed var(--butter-yellow);
        }

        .card-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--chocolate-brown);
        }

        .portion-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 4px 16px;
            border-radius: 40px;
            box-shadow: var(--shadow-sm);
        }

        .portion-control button {
            background: var(--butter-yellow);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: var(--chocolate-brown);
            font-size: 18px;
            cursor: pointer;
            transition: 0.1s;
        }

        .portion-control button:active { transform: scale(0.92); }

        .portion-input {
            width: 48px;
            text-align: center;
            border: none;
            font-weight: 600;
            font-size: 18px;
            background: transparent;
        }

        .group-title {
            font-weight: 700;
            color: var(--purple-spring);
            font-size: 18px;
            font-family: 'Playfair Display', serif;
            margin: 16px 0 8px;
        }

        .ingredient-item {
            background: white;
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
            transition: 0.15s;
            cursor: pointer;
            border: 1px solid #F0E8D8;
        }

        .ingredient-item:hover {
            transform: translateX(4px);
            border-color: var(--butter-yellow);
        }

        .ingredient-item input {
            width: 20px;
            height: 20px;
            accent-color: var(--butter-yellow);
            cursor: pointer;
            pointer-events: none;
        }

        .ingredient-name {
            flex: 1;
            font-weight: 500;
        }

        .ingredient-amount {
            background: #FDF6E8;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: var(--chocolate-brown);
        }

        .ingredient-item.checked {
            opacity: 0.65;
            background: #F5EDE0;
        }
        .ingredient-item.checked .ingredient-name { text-decoration: line-through; }

        /* Панель */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 60px;
            padding: 12px 24px;
            margin-bottom: 32px;
            border: 1px solid rgba(245, 217, 127, 0.5);
        }

        .control-panel label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .reset-btn {
            background: transparent;
            color: var(--chocolate-brown);
            border: 1px solid var(--butter-yellow);
            border-radius: 40px;
            padding: 8px 22px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: var(--butter-yellow);
            color: white;
        }

        /* Шаги */
        .step-group-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--chocolate-brown);
            margin: 36px 0 16px;
            display: inline-block;
            border-bottom: 3px solid var(--butter-yellow);
            padding-bottom: 4px;
        }

        .step-card {
            background: white;
            border-radius: var(--radius-card);
            margin-bottom: 20px;
            transition: 0.2s;
            box-shadow: var(--shadow-sm);
            border: 1px solid #F0E8D8;
        }

        .step-card:hover {
            box-shadow: var(--shadow-md);
        }

        .step-card.locked {
            opacity: 0.65;
            background: #F8F2E8;
            position: relative;
        }
        .step-card.locked::after {
            content: "🔒";
            position: absolute;
            top: 18px;
            right: 18px;
            font-size: 22px;
            opacity: 0.6;
        }

        .step-card.done {
            background: #FDF8F0;
            border-left: 4px solid var(--green-spring);
        }

        .step-card.hidden { display: none; }

        .step-content { padding: 22px; }

        .step-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .step-number {
            background: linear-gradient(145deg, var(--butter-yellow), #E8C86A);
            color: var(--chocolate-brown);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
        }

        .step-title {
            font-weight: 700;
            font-size: 20px;
            flex: 1;
            color: var(--text-dark);
        }

        .step-desc {
            color: var(--text-soft);
            margin-bottom: 16px;
            padding-left: 64px;
            font-size: 14px;
        }

        .substeps {
            padding-left: 64px;
            margin-bottom: 20px;
        }

        .substep {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            flex-wrap: wrap;
        }

        .substep input {
            accent-color: var(--butter-yellow);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .substep.checked span {
            text-decoration: line-through;
            opacity: 0.65;
        }

        .timer-btn {
            background: var(--purple-spring);
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            margin-left: 10px;
            color: white;
            font-size: 11px;
            cursor: pointer;
            transition: 0.15s;
        }

        .timer-btn:hover {
            background: var(--chocolate-brown);
        }

        .step-done-btn {
            width: calc(100% - 44px);
            margin: 0 22px 22px 22px;
            background: transparent;
            border: 1.5px solid var(--butter-yellow);
            border-radius: 60px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: 0.15s;
            color: var(--chocolate-brown);
        }

        .step-done-btn:hover:not(:disabled) {
            background: var(--butter-yellow);
            color: var(--chocolate-brown);
        }

        .step-done-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Плавающий таймер */
        .floating-timer {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: rgba(74, 55, 40, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
            z-index: 200;
            max-width: 380px;
            margin: 0 auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(245, 217, 127, 0.3);
        }

        .floating-timer.visible { transform: translateY(0); }

        .floating-timer-time {
            font-family: monospace;
            font-size: 26px;
            font-weight: 800;
            color: var(--butter-yellow);
        }

        #floatingTimerStop {
            background: rgba(255,255,255,0.12);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            color: white;
        }

        #floatingTimerStop:hover {
            background: var(--purple-spring);
        }

        .scroll-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            background: var(--butter-yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
            box-shadow: var(--shadow-md);
            color: var(--chocolate-brown);
            z-index: 100;
        }

        .scroll-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 24px;
            right: 24px;
            background: rgba(74, 55, 40, 0.95);
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            text-align: center;
            transition: 0.25s;
            transform: translateY(120px);
            opacity: 0;
            z-index: 300;
            font-weight: 500;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .footer {
            text-align: center;
            margin: 48px 0 24px;
            font-size: 24px;
            font-family: 'Playfair Display', serif;
            color: var(--chocolate-brown);
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <span class="logo-icon">🐣</span>
            <span class="logo-text">Кулич <span>пасхальный</span></span>
        </div>
        <button class="theme-btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div class="hero">
        <h1>Творожный кулич <span>с клюквой</span></h1>
        <div class="hero-sub">нежный, сочный, без дрожжей</div>
        <div class="hero-badge"><i class="fas fa-heart"></i> На 2 кулича 12 см</div>
    </div>

    <button class="start-btn" id="startBtn"><i class="fas fa-arrow-down"></i> Начать приготовление</button>

    <div class="progress-card">
        <div class="progress-header">
            <span>🐰 Прогресс</span>
            <span class="progress-percent" id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="steps-count" id="stepsCounter">Выполнено 0 из 5 шагов</div>
    </div>

    <div class="ingredients-card">
        <div class="card-header">
            <h2><i class="fas fa-basket-shopping"></i> Ингредиенты</h2>
            <div class="portion-control">
                <button id="portMinus">-</button>
                <input type="text" id="portionsInput" value="4" class="portion-input">
                <button id="portPlus">+</button>
                <span>порц</span>
            </div>
        </div>
        <div id="ingredientsContainer"></div>
    </div>

    <div class="control-panel">
        <label><input type="checkbox" id="hideDoneCheckbox"> <i class="fas fa-eye-slash"></i> Скрыть готовые шаги</label>
        <button class="reset-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Сбросить всё</button>
    </div>

    <div id="stepsContainer"></div>
    <div class="footer">🐣 Христос Воскресе! 🥚</div>
</div>

<div class="floating-timer" id="floatingTimer">
    <div><span id="floatingTimerName"><i class="fas fa-hourglass-half"></i> Таймер</span><br><span class="floating-timer-time" id="floatingTimerTime">00:00</span></div>
    <button id="floatingTimerStop"><i class="fas fa-stop"></i></button>
</div>
<div class="scroll-top" id="scrollTop"><i class="fas fa-arrow-up"></i></div>
<div id="toast" class="toast"></div>

<script>
(function() {
    // ИНГРЕДИЕНТЫ (база на 2 кулича 12 см, это примерно 4 порции)
    const INGREDIENTS_BASE = {
        basePortions: 4,
        items: [
            { id: 'ing1', name: 'Мука', baseAmount: 370, unit: 'г', category: '🌾 Мучное' },
            { id: 'ing2', name: 'Сметана (от 20%)', baseAmount: 300, unit: 'г', category: '🥛 Молочные' },
            { id: 'ing3', name: 'Сахар', baseAmount: 250, unit: 'г', category: '🍯 Сладости' },
            { id: 'ing4', name: 'Творог (9%)', baseAmount: 220, unit: 'г', category: '🥛 Молочные' },
            { id: 'ing5', name: 'Вяленая клюква', baseAmount: 120, unit: 'г', category: '🍓 Сухофрукты' },
            { id: 'ing6', name: 'Сливочное масло', baseAmount: 100, unit: 'г', category: '🥛 Молочные' },
            { id: 'ing7', name: 'Шоколад', baseAmount: 50, unit: 'г', category: '🍫 Шоколад' },
            { id: 'ing8', name: 'Яйца', baseAmount: 3, unit: 'шт', category: '🥚 Яйца' },
            { id: 'ing9', name: 'Цедра лимона', baseAmount: 1, unit: 'шт', category: '🍋 Ароматизаторы' },
            { id: 'ing10', name: 'Разрыхлитель', baseAmount: 2, unit: 'ч.л.', category: '🌾 Мучное' },
            { id: 'ing11', name: 'Соль', baseAmount: 1, unit: 'щепотка', category: '🧂 Специи' },
            // Для глазури
            { id: 'ing12', name: 'Молочный шоколад (глазурь)', baseAmount: 210, unit: 'г', category: '🍫 Для глазури' },
            { id: 'ing13', name: 'Сливки 33%', baseAmount: 50, unit: 'г', category: '🥛 Для глазури' }
        ]
    };

    // ШАГИ С ЛОГИКОЙ
    const STEPS = [
        { id: 1, title: 'Подготовка основы', desc: 'Протрите творог и растопите масло', group: '🥣 Подготовка', 
          substeps: ['Творог протереть через сито или пробить блендером', 'Сливочное масло растопить и остудить'], 
          requires: [] },
        { id: 2, title: 'Замешивание жидкой основы', desc: 'Взбейте яйца с сахаром, добавьте творог и масло', group: '🥣 Замес теста', 
          substeps: ['Яйца, соль и сахар взбить до увеличения в 2 раза', 'Добавить подготовленный творог и сметану', 'Добавить лимонную цедру', 'Влить растопленное сливочное масло', 'Перемешать до однородности'], 
          requires: [1] },
        { id: 3, title: 'Замешивание теста', desc: 'Добавьте муку, клюкву и шоколад', group: '🥣 Замес теста', 
          substeps: ['Добавить муку и разрыхлитель, замешать лопаткой', 'Добавить вяленую клюкву и шоколад', 'Ещё раз перемешать'], 
          requires: [2] },
        { id: 4, title: 'Выпекание', desc: 'Выпекайте в формах до готовности', group: '🔥 Выпекание', 
          substeps: ['Тесто переложить в формы для куличей', 'Выпекать при 180°C 45-50 минут (таймер)', 'Готовый кулич полностью остудить'], 
          requires: [3] },
        { id: 5, title: 'Приготовление глазури', desc: 'Разогрейте сливки и смешайте с шоколадом', group: '✨ Украшение', 
          substeps: ['Разогреть сливки (не кипятить)', 'Шоколад поломать на кусочки', 'Залить шоколад тёплыми сливками', 'Тщательно перемешать до гладкости', 'Полить глазурью остывший кулич'], 
          requires: [3] } // глазурь можно делать во время выпекания или после
    ];

    let portions = 4;
    let checkedIngredients = JSON.parse(localStorage.getItem('kulich_ingredients') || '[]');
    let completedSteps = JSON.parse(localStorage.getItem('kulich_steps') || '[]');
    let substepsState = JSON.parse(localStorage.getItem('kulich_substeps') || '{}');
    let isDark = localStorage.getItem('kulich_theme') === 'dark';
    let activeTimerInterval = null;
    let activeTimerEndTime = null;

    function isStepAvailable(step) {
        if (completedSteps.includes(step.id)) return false;
        if (!step.requires || step.requires.length === 0) return true;
        return step.requires.every(reqId => completedSteps.includes(reqId));
    }

    function showToast(msg) {
        let t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    function playAlarm() {
        try {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.2;
            osc.type = 'sine';
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1);
            osc.stop(audioCtx.currentTime + 1);
            audioCtx.resume();
        } catch(e) {
            if (navigator.vibrate) navigator.vibrate(300);
        }
    }

    function saveAll() {
        localStorage.setItem('kulich_ingredients', JSON.stringify(checkedIngredients));
        localStorage.setItem('kulich_steps', JSON.stringify(completedSteps));
        localStorage.setItem('kulich_substeps', JSON.stringify(substepsState));
        localStorage.setItem('kulich_portions', portions);
        updateProgress();
    }

    function stopTimerUI() {
        if (activeTimerInterval) clearInterval(activeTimerInterval);
        activeTimerInterval = null;
        activeTimerEndTime = null;
        document.getElementById('floatingTimer')?.classList.remove('visible');
    }

    function startTimer(seconds, name) {
        if (!seconds || seconds <= 0) return;
        stopTimerUI();
        const endTime = Date.now() + seconds * 1000;
        activeTimerEndTime = endTime;
        const updateDisplay = () => {
            const diff = Math.max(0, Math.floor((activeTimerEndTime - Date.now()) / 1000));
            const mins = Math.floor(diff / 60);
            const secs = diff % 60;
            document.getElementById('floatingTimerTime').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            document.getElementById('floatingTimerName').innerHTML = `<i class="fas fa-hourglass-half"></i> ${name}`;
            if (diff <= 0) {
                clearInterval(activeTimerInterval);
                activeTimerInterval = null;
                document.getElementById('floatingTimer').classList.remove('visible');
                playAlarm();
                showToast(`⏰ Таймер "${name}" завершён! Куличи готовы!`);
            }
        };
        updateDisplay();
        activeTimerInterval = setInterval(updateDisplay, 1000);
        document.getElementById('floatingTimer').classList.add('visible');
    }

    function renderIngredients() {
        const container = document.getElementById('ingredientsContainer');
        if (!container) return;
        let cats = [...new Set(INGREDIENTS_BASE.items.map(i => i.category))];
        let html = '';
        cats.forEach(cat => {
            html += `<div class="group-title">${cat}</div>`;
            INGREDIENTS_BASE.items.filter(i => i.category === cat).forEach(ing => {
                let amount = (ing.baseAmount / INGREDIENTS_BASE.basePortions) * portions;
                let display = Number.isInteger(amount) ? amount : amount.toFixed(1);
                let checked = checkedIngredients.includes(ing.id);
                html += `<div class="ingredient-item ${checked ? 'checked' : ''}" data-ing-id="${ing.id}">
                            <input type="checkbox" class="ing-checkbox" ${checked ? 'checked' : ''}>
                            <span class="ingredient-name">${ing.name}</span>
                            <span class="ingredient-amount">${display} ${ing.unit}</span>
                        </div>`;
            });
        });
        container.innerHTML = html;
        document.querySelectorAll('.ingredient-item').forEach(el => {
            let cb = el.querySelector('.ing-checkbox');
            let id = el.dataset.ingId;
            cb.addEventListener('change', () => {
                if (cb.checked) {
                    if (!checkedIngredients.includes(id)) checkedIngredients.push(id);
                    el.classList.add('checked');
                    showToast(`✓ ${INGREDIENTS_BASE.items.find(i => i.id === id).name} добавлен`);
                } else {
                    checkedIngredients = checkedIngredients.filter(i => i !== id);
                    el.classList.remove('checked');
                }
                saveAll();
            });
            el.addEventListener('click', (e) => { if (e.target !== cb) cb.click(); });
        });
    }

    function checkAllSubsteps(stepId) {
        let step = STEPS.find(s => s.id === stepId);
        if (!step || !step.substeps) return true;
        let st = substepsState[stepId] || {};
        return step.substeps.every((_, idx) => st[idx] === true);
    }

    function updateSubstep(stepId, idx, val) {
        if (!substepsState[stepId]) substepsState[stepId] = {};
        substepsState[stepId][idx] = val;
        saveAll();
        if (checkAllSubsteps(stepId) && !completedSteps.includes(stepId)) {
            completedSteps.push(stepId);
            saveAll();
            renderSteps();
            updateProgress();
            showToast(`🎉 Шаг ${stepId} выполнен!`);
            if (completedSteps.length === STEPS.length) celebrate();
        }
        renderSteps();
    }

    function toggleStep(stepId) {
        if (completedSteps.includes(stepId)) {
            completedSteps = completedSteps.filter(id => id !== stepId);
            saveAll();
            renderSteps();
            updateProgress();
            showToast(`Шаг ${stepId} отменён`);
        } else {
            if (!checkAllSubsteps(stepId)) { showToast(`⚠️ Выполните все подшаги!`); return; }
            completedSteps.push(stepId);
            saveAll();
            renderSteps();
            updateProgress();
            showToast(`✓ Шаг ${stepId} готов!`);
            if (completedSteps.length === STEPS.length) celebrate();
        }
    }

    function celebrate() {
        if (typeof confetti !== 'undefined') {
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors: ['#F5D97F', '#B886B8', '#A8C686', '#FFFFFF'] });
        }
        const modal = document.createElement('div');
        modal.className = 'completion-modal';
        modal.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:2000; display:flex; align-items:center; justify-content:center;';
        modal.innerHTML = `<div style="background:white; border-radius:32px; padding:32px; text-align:center; max-width:340px; border:2px solid #F5D97F;"><div style="font-size:64px;">🐣🥚✨</div><h3 style="font-family:Playfair Display; font-size:34px; color:#6B3A2A;">Кулич готов!</h3><p style="margin:12px 0;">Светлой Пасхи! Христос Воскресе!</p><button onclick="this.closest('.completion-modal').remove()" style="background:#F5D97F; border:none; padding:10px 28px; border-radius:40px; color:#6B3A2A; font-size:18px; font-weight:bold; cursor:pointer;">Воистину Воскресе!</button></div>`;
        document.body.appendChild(modal);
        setTimeout(() => modal.remove(), 6000);
    }

    function renderSteps() {
        const container = document.getElementById('stepsContainer');
        if (!container) return;
        let currentGroup = '', html = '';
        STEPS.forEach(step => {
            if (step.group !== currentGroup) { currentGroup = step.group; html += `<div class="step-group-title">${step.group}</div>`; }
            let isDone = completedSteps.includes(step.id);
            let isLocked = !isStepAvailable(step) && !isDone;
            let substepsHtml = '<div class="substeps">';
            if (step.substeps) {
                let st = substepsState[step.id] || {};
                step.substeps.forEach((sub, idx) => {
                    let ch = st[idx] === true;
                    let timerBtn = '';
                    if (step.id === 4 && idx === 1) timerBtn = `<button class="timer-btn" data-timer-seconds="2850" data-timer-name="Выпекание 45-50 мин"><i class="fas fa-hourglass-start"></i> Таймер</button>`;
                    substepsHtml += `<div class="substep ${ch ? 'checked' : ''}"><input type="checkbox" class="substep-cb" data-step="${step.id}" data-idx="${idx}" ${ch ? 'checked' : ''} ${isLocked || isDone ? 'disabled' : ''}><span>${sub}</span>${timerBtn}</div>`;
                });
            }
            substepsHtml += '</div>';
            html += `<div class="step-card ${isDone ? 'done' : ''} ${isLocked ? 'locked' : ''}" data-step-id="${step.id}">
                        <div class="step-content">
                            <div class="step-header"><div class="step-number">${step.id}</div><div class="step-title">${step.title}</div></div>
                            <div class="step-desc">${step.desc}</div>
                            ${substepsHtml}
                        </div>
                        <button class="step-done-btn" data-step-toggle="${step.id}" ${isDone || isLocked ? 'disabled' : ''}>${isDone ? '✓ Готово' : '✓ Отметить выполненным'}</button>
                    </div>`;
        });
        container.innerHTML = html;
        document.querySelectorAll('[data-step-toggle]').forEach(btn => btn.addEventListener('click', () => toggleStep(parseInt(btn.dataset.stepToggle))));
        document.querySelectorAll('.substep-cb').forEach(cb => cb.addEventListener('change', function() { updateSubstep(parseInt(this.dataset.step), parseInt(this.dataset.idx), this.checked); }));
        document.querySelectorAll('.timer-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); let sec = parseInt(btn.dataset.timerSeconds); let name = btn.dataset.timerName || 'Таймер'; startTimer(sec, name); }));
        const hide = document.getElementById('hideDoneCheckbox').checked;
        document.querySelectorAll('.step-card').forEach(card => { let sid = parseInt(card.dataset.stepId); if (hide && completedSteps.includes(sid)) card.classList.add('hidden'); else card.classList.remove('hidden'); });
        updateProgress();
    }

    function updateProgress() {
        let percent = Math.round((completedSteps.length / STEPS.length) * 100);
        document.getElementById('progressFill').style.width = `${percent}%`;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('stepsCounter').innerText = `Выполнено ${completedSteps.length} из ${STEPS.length} шагов`;
        let hide = document.getElementById('hideDoneCheckbox').checked;
        document.querySelectorAll('.step-card').forEach(card => { let stepId = parseInt(card.dataset.stepId); if (hide && completedSteps.includes(stepId)) card.classList.add('hidden'); else card.classList.remove('hidden'); });
    }

    function resetAll() {
        if (confirm('🐣 Сбросить весь прогресс приготовления кулича?')) {
            completedSteps = []; checkedIngredients = []; substepsState = {}; portions = 4;
            document.getElementById('portionsInput').value = 4;
            stopTimerUI();
            saveAll();
            renderIngredients();
            renderSteps();
            updateProgress();
            showToast('✨ Прогресс сброшен, начинаем заново!');
        }
    }

    function initTheme() {
        const root = document.documentElement;
        if (isDark) {
            root.style.setProperty('--pastel-yellow', '#2A2820');
            root.style.setProperty('--pastel-yellow-dark', '#1F1D18');
            root.style.setProperty('--egg-white', '#2A2820');
            root.style.setProperty('--butter-yellow', '#C9A86A');
            root.style.setProperty('--chocolate-brown', '#D4B88A');
            root.style.setProperty('--text-dark', '#E8E0D0');
            root.style.setProperty('--text-soft', '#B0AA98');
            document.getElementById('themeBtn').innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            root.style.setProperty('--pastel-yellow', '#FFF8E7');
            root.style.setProperty('--pastel-yellow-dark', '#F5E9C8');
            root.style.setProperty('--egg-white', '#FFFFFF');
            root.style.setProperty('--butter-yellow', '#F5D97F');
            root.style.setProperty('--chocolate-brown', '#6B3A2A');
            root.style.setProperty('--text-dark', '#4A3728');
            root.style.setProperty('--text-soft', '#7A6B5A');
            document.getElementById('themeBtn').innerHTML = '<i class="fa-solid fa-moon"></i>';
        }
    }

    // События
    document.getElementById('themeBtn')?.addEventListener('click', () => { isDark = !isDark; localStorage.setItem('kulich_theme', isDark); initTheme(); });
    document.getElementById('resetBtn')?.addEventListener('click', resetAll);
    document.getElementById('hideDoneCheckbox')?.addEventListener('change', () => renderSteps());
    document.getElementById('startBtn')?.addEventListener('click', () => { let first = document.querySelector('.step-card:not(.done):not(.locked)'); if (first) first.scrollIntoView({ behavior: 'smooth' }); });
    document.getElementById('portMinus')?.addEventListener('click', () => { portions = Math.max(2, portions-1); document.getElementById('portionsInput').value = portions; renderIngredients(); saveAll(); });
    document.getElementById('portPlus')?.addEventListener('click', () => { portions = Math.min(8, portions+1); document.getElementById('portionsInput').value = portions; renderIngredients(); saveAll(); });
    document.getElementById('portionsInput')?.addEventListener('change', function() { let v = parseInt(this.value)||4; v = Math.min(8, Math.max(2,v)); portions=v; this.value=v; renderIngredients(); saveAll(); });
    document.getElementById('scrollTop')?.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));
    window.addEventListener('scroll', () => { document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 200); });
    document.getElementById('floatingTimerStop')?.addEventListener('click', () => stopTimerUI());

    initTheme();
    renderIngredients();
    renderSteps();
    updateProgress();
})();
</script>
</body>
</html>
