<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Секреты идеальных пельменей — рецепт с выбором способа приготовления, который всегда показывает, что делать прямо сейчас">
<meta name="theme-color" content="#3A3D42">
<title>🥟 Секреты идеальных пельменей</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Chivo+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>

<style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    :root{
        --graphite:#3A3D42;
        --graphite-light:#5C6066;
        --terracotta:#C96A4B;
        --terracotta-dark:#A6543A;
        --paper:#F7F5F2;
        --surface:#FFFFFF;
        --text:#2B2D30;
        --text-soft:#787C82;
        --line:rgba(58,61,66,0.13);
        --shadow-sm:0 3px 10px rgba(0,0,0,0.05);
        --shadow-md:0 8px 20px rgba(0,0,0,0.08);
        --shadow-lg:0 18px 40px rgba(0,0,0,0.18);
        --inset-highlight:rgba(255,255,255,0.6);
        --r-card:10px;
        --r-full:999px;
        --ease:cubic-bezier(.22,.9,.32,1);
    }

    [data-theme="dark"]{
        --paper:#1E1F21;
        --surface:#28292C;
        --text:#EDECE8;
        --text-soft:#A7A9AC;
        --line:rgba(201,106,75,0.2);
        --shadow-sm:0 3px 10px rgba(0,0,0,0.28);
        --shadow-md:0 8px 20px rgba(0,0,0,0.34);
        --shadow-lg:0 18px 40px rgba(0,0,0,0.46);
        --inset-highlight:rgba(255,255,255,0.04);
    }

    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{
            animation-duration:0.01ms !important;
            animation-iteration-count:1 !important;
            transition-duration:0.01ms !important;
            scroll-behavior:auto !important;
        }
    }

    html{ scroll-behavior:smooth; }
    body{
        background:var(--paper);
        font-family:'IBM Plex Sans',sans-serif;
        color:var(--text);
        min-height:100vh;
        transition:background .3s var(--ease), color .3s var(--ease);
        -webkit-font-smoothing:antialiased;
    }
    ::selection{ background:var(--terracotta); color:#fff; }
    :focus-visible{ outline:3px solid var(--terracotta-dark); outline-offset:2px; }

    .app{ max-width:780px; margin:0 auto; padding:18px 18px 110px; }
    @media (min-width:768px){ .app{ padding:40px 30px 130px; } }

    /* ===== HEADER ===== */
    .header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding:12px 20px; background:var(--surface); border-radius:var(--r-card); box-shadow:var(--shadow-sm); border:1px solid var(--line); }
    .logo{ display:flex; align-items:center; gap:11px; }
    .logo-icon{ font-size:26px; display:inline-block; animation:iconWiggle 3.2s ease-in-out infinite; }
    @keyframes iconWiggle{ 0%,100%{ transform:rotate(-6deg); } 50%{ transform:rotate(6deg); } }
    .logo-text{ font-family:'Sora',sans-serif; font-weight:700; font-size:15.5px; color:var(--graphite); letter-spacing:-0.01em; }
    .logo-text span{ color:var(--terracotta); }
    .theme-btn{ background:transparent; border:1.5px solid var(--terracotta); border-radius:50%; width:36px; height:36px; color:var(--terracotta); cursor:pointer; transition:.2s var(--ease); display:flex; align-items:center; justify-content:center; }
    .theme-btn:hover{ background:var(--terracotta); color:#fff; }

    /* ===== PHOTO GALLERY ===== */
    .photo-card{ background:var(--surface); border-radius:var(--r-card); padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow-sm), inset 0 1px 0 var(--inset-highlight); border:1px solid var(--line); }
    .photo-strip{ display:flex; gap:9px; flex-wrap:wrap; }
    .photo-thumb{ width:76px; height:76px; border-radius:6px; background-size:cover; background-position:center; position:relative; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .25s var(--ease); flex-shrink:0; animation:photoIn .3s var(--ease); }
    @keyframes photoIn{ from{ opacity:0; transform:scale(.8); } to{ opacity:1; transform:scale(1); } }
    .photo-thumb:hover{ transform:scale(1.05); }
    .photo-thumb:active{ transform:scale(.95); }
    .photo-delete{ position:absolute; top:-6px; right:-6px; width:21px; height:21px; border-radius:50%; background:var(--terracotta); color:#fff; border:2px solid var(--surface); display:flex; align-items:center; justify-content:center; font-size:10px; cursor:pointer; }
    .photo-add{ width:76px; height:76px; border-radius:6px; border:1.5px dashed var(--line); background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text-soft); cursor:pointer; font-size:10px; font-weight:600; text-align:center; transition:.2s var(--ease); flex-shrink:0; }
    .photo-add:hover{ border-color:var(--terracotta); color:var(--terracotta); }
    .photo-add:active{ transform:scale(.95); }
    .photo-add i{ font-size:15px; }
    .photo-empty-hint{ display:none; align-items:center; gap:9px; color:var(--text-soft); font-size:12px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
    .photo-empty-hint i{ font-size:17px; opacity:.4; }

    .lightbox{ position:fixed; inset:0; background:rgba(20,20,20,.9); z-index:3000; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeIn .2s var(--ease); }
    @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
    .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; box-shadow:var(--shadow-lg); }
    .lightbox-close{ position:absolute; top:20px; right:20px; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.15); border:none; color:#fff; font-size:16px; cursor:pointer; }

    /* ===== HERO ===== */
    .hero{ text-align:center; margin-bottom:16px; background:var(--surface); border-radius:var(--r-card); padding:26px 20px; box-shadow:var(--shadow-sm), inset 0 1px 0 var(--inset-highlight); border:1px solid var(--line); animation:rise .55s var(--ease) both; }
    @keyframes rise{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
    .hero h1{ font-family:'Sora',sans-serif; font-weight:800; font-size:26px; color:var(--graphite); letter-spacing:-0.01em; }
    @media (min-width:600px){ .hero h1{ font-size:32px; } }
    .hero p{ color:var(--text-soft); margin-top:6px; font-size:13.5px; }
    .hero-badge{ display:inline-block; background:var(--terracotta); color:#fff; padding:5px 16px; border-radius:var(--r-full); font-size:11.5px; margin-top:11px; font-weight:600; }

    .status-line{ margin-top:14px; display:inline-flex; align-items:center; gap:9px; background:var(--paper); padding:8px 16px; border-radius:var(--r-full); font-size:13px; font-weight:600; color:var(--graphite); }
    .status-line .dot{ width:7px; height:7px; border-radius:50%; background:var(--terracotta); flex-shrink:0; opacity:.5; }
    .status-line .dot.active{ opacity:1; animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(201,106,75,0.35);} 50%{ box-shadow:0 0 0 6px rgba(201,106,75,0);} }

    /* ===== METHOD SELECTOR (сохранённая полезная фишка) ===== */
    .method-card{ background:var(--surface); border-radius:var(--r-card); padding:16px 18px; margin-bottom:16px; box-shadow:var(--shadow-sm); border:1px solid var(--line); }
    .method-card h3{ font-family:'Sora',sans-serif; font-weight:700; font-size:13px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:11px; }
    .method-tabs{ display:flex; gap:6px; background:var(--paper); padding:4px; border-radius:var(--r-full); }
    .method-btn{ flex:1; background:transparent; border:none; border-radius:var(--r-full); padding:9px 10px; font-weight:600; font-size:12.5px; cursor:pointer; color:var(--text-soft); transition:.2s var(--ease); display:flex; align-items:center; justify-content:center; gap:6px; }
    .method-btn.active{ background:var(--graphite); color:#fff; box-shadow:var(--shadow-sm); }
    .method-btn:not(.active):hover{ color:var(--graphite); }

    .start-btn{ background:var(--graphite); border:none; border-radius:var(--r-card); padding:15px 24px; width:100%; color:#fff; font-weight:700; font-size:14.5px; cursor:pointer; margin-bottom:16px; box-shadow:0 12px 24px -10px rgba(58,61,66,0.4); transition:transform .2s var(--ease), background .2s; display:flex; align-items:center; justify-content:center; gap:9px; }
    .start-btn:hover{ background:var(--terracotta-dark); transform:translateY(-2px); }
    .start-btn:active{ transform:scale(.97); }

    /* ===== PROGRESS DOTS ===== */
    .dots-card{ background:var(--surface); border-radius:var(--r-card); padding:14px 18px; margin-bottom:16px; box-shadow:var(--shadow-sm); border:1px solid var(--line); }
    .dots-row{ display:flex; flex-wrap:wrap; gap:6px; }
    .step-dot{ width:10px; height:10px; border-radius:2px; background:rgba(58,61,66,0.14); border:none; padding:0; cursor:pointer; transition:transform .2s var(--ease), background .2s var(--ease); }
    .step-dot:hover{ transform:scale(1.3); }
    .step-dot.done{ background:var(--terracotta); animation:dotPop .35s var(--ease); }
    @keyframes dotPop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.6); } 100%{ transform:scale(1); } }
    .step-dot.current{ background:var(--graphite); transform:scale(1.3); }
    .dots-label{ margin-top:8px; font-size:12px; color:var(--text-soft); }

    /* ===== CARDS COMMON ===== */
    .card{ background:var(--surface); border-radius:var(--r-card); padding:20px; margin-bottom:16px; box-shadow:var(--shadow-sm), inset 0 1px 0 var(--inset-highlight); border:1px solid var(--line); transition:transform .25s var(--ease); }
    .card:hover{ transform:translateY(-2px); }
    .card-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px; }
    .card-header h2{ font-family:'Sora',sans-serif; font-weight:700; font-size:16.5px; color:var(--graphite); }

    .portion-control{ display:flex; align-items:center; gap:8px; background:var(--paper); padding:4px 13px; border-radius:var(--r-full); }
    .portion-control button{ background:var(--graphite); border:none; width:27px; height:27px; border-radius:50%; color:#fff; font-weight:700; cursor:pointer; transition:transform .15s var(--ease); box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 3px 6px rgba(0,0,0,.25); }
    .portion-control button:hover{ transform:scale(1.08); }
    .portion-control button:active{ transform:scale(.92); }
    .portion-input{ width:32px; text-align:center; border:none; background:transparent; font-weight:700; font-size:13.5px; color:var(--text); font-family:'Chivo Mono',monospace; outline:none; }
    .portion-control span{ font-size:11px; color:var(--text-soft); font-weight:600; }

    .ing-category{ font-weight:700; color:var(--terracotta-dark); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin:14px 0 7px; }
    .ing-category:first-child{ margin-top:0; }
    .ingredient-item{ background:var(--paper); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:11px; margin-bottom:6px; cursor:pointer; transition:opacity .2s var(--ease), transform .2s var(--ease); }
    .ingredient-item:hover{ transform:translateX(3px); }
    .ingredient-item:active{ transform:scale(.98); }
    .ingredient-item input{ width:18px; height:18px; cursor:pointer; accent-color:var(--graphite); flex-shrink:0; }
    .ingredient-item input:checked{ animation:checkPop .3s var(--ease); }
    @keyframes checkPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
    .ingredient-name{ flex:1; font-weight:500; font-size:13.5px; }
    .ingredient-amount{ background:var(--surface); padding:3px 11px; border-radius:var(--r-full); font-size:11.5px; font-weight:700; color:var(--terracotta-dark); font-family:'Chivo Mono',monospace; border:1px solid var(--line); }
    .ingredient-item.checked{ opacity:.55; }
    .ingredient-item.checked .ingredient-name{ text-decoration:line-through; }

    .wake-btn{ width:100%; background:var(--paper); border:1.5px solid var(--line); color:var(--graphite); padding:11px; border-radius:var(--r-full); margin-top:14px; font-weight:600; font-size:12.5px; cursor:pointer; transition:background .2s; }
    .wake-btn:hover{ background:var(--line); }
    .wake-btn.active{ background:var(--terracotta); border-color:var(--terracotta); color:#fff; }

    .control-panel{ display:flex; justify-content:flex-end; align-items:center; background:var(--surface); padding:10px 18px; border-radius:var(--r-full); margin-bottom:18px; box-shadow:var(--shadow-sm); border:1px solid var(--line); }
    .reset-btn{ background:none; border:none; color:var(--text-soft); font-weight:600; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; }
    .reset-btn:hover{ color:var(--terracotta-dark); }

    /* ===== STEPS ===== */
    .step-group-title{ font-family:'Sora',sans-serif; font-weight:700; font-size:17px; color:var(--graphite); margin:30px 0 12px; padding-bottom:5px; border-bottom:2px solid var(--terracotta); display:inline-block; }
    .step-group-title:first-of-type{ margin-top:0; }

    .step-card{ background:var(--surface); border-radius:var(--r-card); margin-bottom:11px; border:1.5px solid var(--line); position:relative; transition:border-color .3s var(--ease), opacity .3s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease); box-shadow:var(--shadow-sm), inset 0 1px 0 var(--inset-highlight); }
    .step-card.enter{ animation:cardIn .5s var(--ease) both; }
    @keyframes cardIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
    .step-card.current{ border-color:var(--terracotta); box-shadow:var(--shadow-md); }
    .step-card:not(.locked):not(.done):hover{ transform:translateY(-2px); }
    .step-card.done{ opacity:.55; }
    .step-card.locked{ opacity:.5; }
    .step-card.locked::after{ content:"\f023"; font-family:"Font Awesome 6 Free"; font-weight:900; position:absolute; top:16px; right:16px; font-size:13px; color:var(--text-soft); opacity:.6; }
    .step-content{ padding:18px; }
    .step-header{ display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
    .step-number{ width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Chivo Mono',monospace; font-weight:700; font-size:13px; color:#fff; background:var(--graphite); flex-shrink:0; box-shadow:inset 0 2px 3px rgba(255,255,255,.1), 0 3px 8px rgba(0,0,0,.25); }
    .step-card.current .step-number{ background:var(--terracotta); animation:numberGlow 2s ease-in-out infinite; }
    @keyframes numberGlow{ 0%,100%{ box-shadow:inset 0 2px 3px rgba(255,255,255,.1), 0 3px 8px rgba(0,0,0,.25), 0 0 0 0 rgba(201,106,75,.4); } 50%{ box-shadow:inset 0 2px 3px rgba(255,255,255,.1), 0 3px 8px rgba(0,0,0,.25), 0 0 0 6px rgba(201,106,75,0); } }
    .step-title{ font-weight:700; font-size:14.5px; font-family:'Sora',sans-serif; }
    .step-timer-badge{ background:var(--paper); border-radius:var(--r-full); padding:4px 12px; font-size:11px; color:var(--graphite); font-weight:600; }
    .current-tag{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; background:var(--terracotta); color:#fff; padding:3px 9px; border-radius:var(--r-full); }
    .step-desc{ color:var(--text-soft); margin-bottom:12px; padding-left:44px; font-size:12.5px; line-height:1.5; }

    .substeps{ padding-left:44px; margin-bottom:11px; display:flex; flex-direction:column; gap:1px; }
    .substep{ display:grid; grid-template-columns:15px 1fr; align-items:start; gap:9px; padding:6px 0; cursor:pointer; }
    .substep input{ width:15px; height:15px; cursor:pointer; accent-color:var(--graphite); margin-top:2px; }
    .substep input:checked{ animation:checkPop .3s var(--ease); }
    .substep.checked span{ text-decoration:line-through; opacity:.55; }
    .substep span{ font-size:12.5px; line-height:1.4; }

    .timer-control{ padding-left:44px; margin:11px 0 4px; }
    .timer-btn{ background:var(--graphite); border:none; padding:9px 18px; border-radius:var(--r-full); font-weight:600; font-size:12.5px; color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:transform .15s var(--ease); }
    .timer-btn:active{ transform:scale(.96); }

    /* signature element: намеренно сдержанный — тонкая линия прогресса без лишних украшений */
    .timer-active{ display:inline-flex; align-items:center; gap:12px; background:var(--paper); padding:8px 14px; border-radius:var(--r-full); }
    .timer-time{ font-family:'Chivo Mono',monospace; font-size:13.5px; font-weight:700; color:var(--graphite); }
    .timer-progress-track{ width:70px; height:3px; background:rgba(58,61,66,0.14); border-radius:var(--r-full); }
    .timer-progress-fill{ height:100%; background:var(--terracotta); width:0%; border-radius:var(--r-full); transition:width 1s linear; }
    .timer-icon-btn{ background:var(--surface); border:1px solid var(--line); width:30px; height:30px; border-radius:50%; cursor:pointer; color:var(--graphite); }

    .step-done-btn{ width:calc(100% - 36px); margin:0 18px 18px; background:transparent; border:1.5px solid var(--graphite); border-radius:var(--r-full); padding:10px; font-weight:600; font-size:12.5px; cursor:pointer; color:var(--graphite); transition:background .2s, color .2s, transform .15s; }
    .step-done-btn:hover:not(:disabled){ background:var(--graphite); color:#fff; }
    .step-done-btn:active:not(:disabled){ transform:scale(.98); }
    .step-done-btn:disabled{ opacity:.5; cursor:not-allowed; }
    .step-card.done .step-done-btn{ background:var(--terracotta); border-color:var(--terracotta); color:#fff; opacity:1; }

    /* ===== FLOATING PILL ===== */
    .float-pill{ position:fixed; left:16px; right:16px; bottom:20px; z-index:200; background:var(--graphite); color:#fff; border-radius:var(--r-full); padding:11px 11px 11px 18px; display:flex; align-items:center; justify-content:space-between; gap:13px; box-shadow:var(--shadow-lg); transform:translateY(140%); transition:transform .4s var(--ease); max-width:400px; margin:0 auto; cursor:pointer; }
    .float-pill.visible{ transform:translateY(0); }
    .float-pill .fp-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,0.55); font-weight:700; }
    .float-pill .fp-main{ font-size:13px; font-weight:600; }
    .float-pill .fp-time{ font-family:'Chivo Mono',monospace; font-size:18px; font-weight:800; color:var(--terracotta); }
    .fp-stop{ background:rgba(255,255,255,0.14); border:none; width:34px; height:34px; border-radius:50%; color:#fff; cursor:pointer; flex-shrink:0; }

    .scroll-top{ position:fixed; bottom:82px; right:16px; width:42px; height:42px; background:var(--surface); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; visibility:hidden; transition:.25s; box-shadow:var(--shadow-md); color:var(--graphite); border:1px solid var(--line); }
    .scroll-top.visible{ opacity:1; visibility:visible; }

    .toast{ position:fixed; bottom:96px; left:20px; right:20px; background:var(--graphite); color:#fff; padding:11px 18px; border-radius:var(--r-full); text-align:center; z-index:300; font-weight:600; font-size:12.5px; transform:translateY(100px); opacity:0; transition:.35s var(--ease); max-width:400px; margin:0 auto; }
    .toast.show{ transform:translateY(0); opacity:1; }

    .footer{ text-align:center; margin:42px 0 10px; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; color:var(--graphite); opacity:.7; }

    .completion-modal{ position:fixed; inset:0; background:rgba(20,20,20,0.7); backdrop-filter:blur(8px); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px; }
    .completion-card{ background:var(--surface); border-radius:var(--r-card); padding:34px 28px; text-align:center; max-width:320px; animation:cardIn .4s var(--ease); border-top:3px solid var(--terracotta); }
    .completion-card .emoji{ font-size:46px; margin-bottom:12px; }
    .completion-card h3{ font-family:'Sora',sans-serif; font-size:21px; color:var(--graphite); margin-bottom:7px; }
    .completion-card p{ color:var(--text-soft); font-size:12.5px; margin-bottom:18px; line-height:1.5; }
    .completion-btn{ background:var(--graphite); border:none; padding:11px 26px; border-radius:var(--r-full); color:#fff; font-weight:700; cursor:pointer; width:100%; }
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo"><span class="logo-icon">🥟</span><span class="logo-text">Идеальные <span>пельмени</span></span></div>
        <button class="theme-btn" id="themeBtn" aria-label="Переключить тёмную тему"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div class="card photo-card">
        <div class="card-header">
            <h2><i class="fas fa-camera"></i> Фото</h2>
        </div>
        <div class="photo-strip" id="photoStrip"></div>
        <div class="photo-empty-hint" id="photoEmptyHint">
            <i class="fas fa-image"></i>
            <span>Добавьте свои фото готового блюда</span>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </div>

    <div class="hero">
        <h1>Секреты идеальных пельменей</h1>
        <p>🥟 простой рецепт, три способа варки на выбор</p>
        <div class="hero-badge"><i class="fas fa-heart"></i> Домашний рецепт</div>
        <div class="status-line" id="statusLine"><span class="dot active" id="statusDot"></span><span id="statusText">Готовим первый шаг</span></div>
    </div>

    <div class="method-card">
        <h3>Способ приготовления</h3>
        <div class="method-tabs" id="methodTabs">
            <button class="method-btn" data-method="stove"><i class="fas fa-fire"></i> Плита</button>
            <button class="method-btn" data-method="multicooker"><i class="fas fa-blender"></i> Мультиварка</button>
            <button class="method-btn" data-method="microwave"><i class="fas fa-satellite-dish"></i> СВЧ</button>
        </div>
    </div>

    <button class="start-btn" id="startBtn"><i class="fas fa-arrow-down"></i> Перейти к текущему шагу</button>

    <div class="dots-card">
        <div class="dots-row" id="dotsRow"></div>
        <div class="dots-label" id="dotsLabel">Выполнено 0 из 9 шагов</div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-basket-shopping"></i> Ингредиенты</h2>
            <div class="portion-control">
                <button id="portMinus" aria-label="Уменьшить количество порций">−</button>
                <input type="text" id="portionsInput" value="2" class="portion-input" inputmode="numeric" pattern="[0-9]*" aria-label="Количество порций">
                <button id="portPlus" aria-label="Увеличить количество порций">+</button>
                <span>порц.</span>
            </div>
        </div>
        <div id="ingredientsContainer"></div>
        <button class="wake-btn" id="wakeLockBtn"><i class="fas fa-sun"></i> Экран не гаснет</button>
    </div>

    <div class="control-panel">
        <button class="reset-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Сбросить весь прогресс</button>
    </div>

    <div id="stepsContainer"></div>
    <div class="footer">🥟 Приятного аппетита!</div>
</div>

<div class="float-pill" id="floatPill">
    <div><div class="fp-label" id="fpLabel">Далее</div><div class="fp-main" id="fpMain">Шаг 1</div></div>
    <div style="display:flex; align-items:center; gap:12px;">
        <span class="fp-time" id="fpTime" style="display:none;">00:00</span>
        <button class="fp-stop" id="fpStop" style="display:none;" aria-label="Остановить таймер"><i class="fas fa-stop"></i></button>
        <i class="fas fa-arrow-right" id="fpArrow" style="opacity:.6;"></i>
    </div>
</div>

<div class="scroll-top" id="scrollTop" role="button" tabindex="0" aria-label="Наверх страницы"><i class="fas fa-arrow-up"></i></div>
<div id="toast" class="toast"></div>
<audio id="alarmAudio" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg"></audio>

<script>
(function(){
    "use strict";

    const AUTO_RESET_SECONDS = 12 * 3600;
    const MIN_PORTIONS = 1;
    const MAX_PORTIONS = 50;
    const PORTIONS_JOKE_THRESHOLD = 8;

    /* ============================================ */
    /* === ИНГРЕДИЕНТЫ =============================== */
    /* ============================================ */

    const INGREDIENTS_BASE = {
        basePortions:2,
        items:[
            { id:'ing1', name:'Пельмени', baseAmount:500, unit:'г', category:'🥟 Основа' },
            { id:'ing2', name:'Вода', baseAmount:1500, unit:'мл', category:'💧 Основа' },
            { id:'ing3', name:'Масло растительное', baseAmount:2, unit:'ст.л.', category:'🫒 Основа' },
            { id:'ing4', name:'Соль', baseAmount:1, unit:'ч.л.', category:'🧂 Специи' },
            { id:'ing5', name:'Лавровый лист', baseAmount:1, unit:'шт.', category:'🌿 Специи' },
            { id:'ing6', name:'Перец горошком', baseAmount:1, unit:'щепотка', category:'🌿 Специи' },
            { id:'ing7', name:'Лук репчатый', baseAmount:1, unit:'шт.', category:'🧅 Специи' },
            { id:'ing8', name:'Сметана', baseAmount:1, unit:'по вкусу', category:'🍯 Подача' },
            { id:'ing9', name:'Масло сливочное', baseAmount:30, unit:'г', category:'🧈 Подача' },
            { id:'ing10', name:'Зелень', baseAmount:1, unit:'по желанию', category:'🌿 Подача' }
        ]
    };

    const BASE_STEPS = [
        { id:1, group:'🍜 Подготовка', title:'Подготовка', desc:'Достаньте пельмени из морозилки', substeps:['Достать пельмени из морозилки','Отмерить воду','Подготовить специи и лук'], timer:null, requires:[] },
        { id:2, group:'🍜 Подготовка', title:'Вскипятить воду', desc:'Налейте воду в кастрюлю, поставьте на огонь', substeps:['Налить воду в ёмкость','Добавить соль','Довести до кипения'], timer:null, requires:[1] },
        { id:3, group:'🍜 Подготовка', title:'Добавить приправы', desc:'В кипящую воду положите специи', substeps:['Добавить лавровый лист','Добавить перец горошком','Добавить луковицу целиком','Влить растительное масло'], timer:null, requires:[2] },
        { id:4, group:'🔥 Варка', title:'Закинуть пельмени', desc:'Аккуратно выложите пельмени в кипяток', substeps:['Выложить пельмени','Сразу перемешать','Дождаться повторного закипания'], timer:null, requires:[3] }
    ];

    const METHOD_STEPS = {
        stove:[
            { id:5, group:'🔥 Варка', title:'Варка на плите', desc:'Убавьте огонь и варите пельмени', substeps:['Убавить огонь до среднего','Варить 7 минут','Периодически помешивать'], timer:{duration:420, label:'7 мин'}, requires:[4] },
            { id:6, group:'🍽️ Подача', title:'Слить воду', desc:'Откиньте пельмени на дуршлаг', substeps:['Откинуть на дуршлаг','Дать стечь воде','Добавить сливочное масло'], timer:null, requires:[5] }
        ],
        multicooker:[
            { id:5, group:'🔥 Варка', title:'Варка в мультиварке', desc:'Закройте крышку и выберите режим', substeps:['Закрыть крышку','Выбрать режим "Варка"','Варить 8 минут'], timer:{duration:480, label:'8 мин'}, requires:[4] },
            { id:6, group:'🍽️ Подача', title:'Достать пельмени', desc:'Откройте крышку и достаньте пельмени', substeps:['Открыть крышку','Достать пельмени шумовкой','Добавить сливочное масло'], timer:null, requires:[5] }
        ],
        microwave:[
            { id:5, group:'🔥 Варка', title:'Варка в микроволновке', desc:'Накройте и поставьте в микроволновку', substeps:['Накрыть крышкой','Поставить в микроволновку','Готовить на полной мощности 6 минут'], timer:{duration:360, label:'6 мин'}, requires:[4] },
            { id:6, group:'🍽️ Подача', title:'Достать пельмени', desc:'Осторожно достаньте и перемешайте', substeps:['Осторожно достать','Перемешать','Добавить сливочное масло'], timer:null, requires:[5] }
        ]
    };

    const FINAL_STEPS = [
        { id:7, group:'🍽️ Подача', title:'Смазать маслом', desc:'Перед подачей смажьте пельмени сливочным маслом', substeps:['Растопить сливочное масло','Полить пельмени','Перемешать'], timer:null, requires:[6] },
        { id:8, group:'🍽️ Подача', title:'Подавать с соусом', desc:'Подавайте пельмени со сметаной или любимым соусом', substeps:['Разложить по тарелкам','Добавить сметану','Посыпать зеленью'], timer:null, requires:[7] },
        { id:9, group:'🍽️ Подача', title:'Приятного аппетита!', desc:'Зовите родных и наслаждайтесь', substeps:['Позвать к столу','Приятного аппетита!'], timer:null, requires:[8] }
    ];

    function getAllSteps(){
        return [...BASE_STEPS, ...(METHOD_STEPS[currentMethod] || METHOD_STEPS.stove), ...FINAL_STEPS];
    }

    /* ============================================ */
    /* === СОСТОЯНИЕ ================================ */
    /* ============================================ */

    let currentMethod = localStorage.getItem('pelmeni_method') || 'stove';
    let checkedIngredients = JSON.parse(localStorage.getItem('pelmeni_ingredients') || '[]');
    let completedSteps = JSON.parse(localStorage.getItem('pelmeni_steps') || '[]');
    let substepsState = JSON.parse(localStorage.getItem('pelmeni_substeps') || '{}');
    let timersState = JSON.parse(localStorage.getItem('pelmeni_timers') || '{}');
    let portions = clampPortions(parseInt(localStorage.getItem('pelmeni_portions')) || INGREDIENTS_BASE.basePortions);
    let currentActiveTimerId = null;
    let wakeLock = null;
    let lastActivity = localStorage.getItem('pelmeni_last_activity');
    let isDark = localStorage.getItem('pelmeni_theme') === 'dark';
    let photos = JSON.parse(localStorage.getItem('pelmeni_photos') || '[]');
    let firstStepsRender = true;

    function clampPortions(v){ return Math.min(MAX_PORTIONS, Math.max(MIN_PORTIONS, isNaN(v)?INGREDIENTS_BASE.basePortions:v)); }

    /** Переводит крупные значения в удобные единицы: 1000 г -> 1 кг, 1500 мл -> 1.5 л. */
    function formatAmount(amount, unit){
        if((unit==='г' || unit==='мл') && amount>=1000){
            let converted = Math.round((amount/1000)*10)/10;
            return { amount:converted, unit: unit==='г'?'кг':'л' };
        }
        return { amount: Number.isInteger(amount)?amount:Math.round(amount*10)/10, unit };
    }

    /* ============================================ */
    /* === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =================== */
    /* ============================================ */

    function isStepAvailable(step){
        if (completedSteps.includes(step.id)) return false;
        if (!step.requires || step.requires.length === 0) return true;
        return step.requires.every(reqId => completedSteps.includes(reqId));
    }

    function getCurrentStep(){
        return getAllSteps().find(s => !completedSteps.includes(s.id) && isStepAvailable(s));
    }

    function saveAll(){
        try{
            localStorage.setItem('pelmeni_ingredients', JSON.stringify(checkedIngredients));
            localStorage.setItem('pelmeni_steps', JSON.stringify(completedSteps));
            localStorage.setItem('pelmeni_timers', JSON.stringify(timersState));
            localStorage.setItem('pelmeni_substeps', JSON.stringify(substepsState));
            localStorage.setItem('pelmeni_last_activity', Date.now().toString());
            localStorage.setItem('pelmeni_portions', portions);
            localStorage.setItem('pelmeni_method', currentMethod);
        }catch(e){ console.error('Ошибка сохранения в localStorage:', e); }
    }

    function showToast(msg, duration){
        let t = document.getElementById('toast');
        if(!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(()=>t.classList.remove('show'), duration || 2200);
    }

    function maybeJokeAboutPortions(newValue, oldValue){
        if(newValue > PORTIONS_JOKE_THRESHOLD && oldValue <= PORTIONS_JOKE_THRESHOLD){
            showToast(`🥟 Ого, ${newValue} порций! Зачем тебе столько? 😄`, 3200);
        }
    }

    function playSound(){
        let audio = document.getElementById('alarmAudio');
        if(audio) audio.play().catch(()=>{ if(navigator.vibrate) navigator.vibrate(200); });
    }

    function formatTime(sec){ let m=Math.floor(sec/60), s=sec%60; return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }

    function checkAutoReset(){
        if(lastActivity){
            let diff = (Date.now() - parseInt(lastActivity)) / 1000;
            if(diff >= AUTO_RESET_SECONDS){
                completedSteps=[]; checkedIngredients=[]; substepsState={}; timersState={};
                currentActiveTimerId=null; portions=INGREDIENTS_BASE.basePortions;
                document.getElementById('portionsInput').value = portions;
                saveAll();
                showToast('✨ Новый день — прогресс обновлён');
                return true;
            }
        }
        return false;
    }

    /* ============================================ */
    /* === СПОСОБ ПРИГОТОВЛЕНИЯ ======================= */
    /* ============================================ */

    function updateMethodUI(){
        document.querySelectorAll('.method-btn').forEach(btn=>{
            btn.classList.toggle('active', btn.dataset.method === currentMethod);
        });
    }

    function setMethod(method){
        if(method === currentMethod) return;
        currentMethod = method;
        completedSteps = completedSteps.filter(id => id < 5 || id > 6);
        substepsState = Object.fromEntries(Object.entries(substepsState).filter(([id]) => id < 5 || id > 6));
        timersState = Object.fromEntries(Object.entries(timersState).filter(([id]) => id < 5 || id > 6));
        currentActiveTimerId = null;
        saveAll();
        updateMethodUI();
        renderSteps();
        showToast(`✅ Способ: ${method==='stove'?'на плите':method==='multicooker'?'в мультиварке':'в микроволновке'}`);
    }

    /* ============================================ */
    /* === СТАТУС-СТРОКА И ТОЧКИ ===================== */
    /* ============================================ */

    function updateStatusAndDots(){
        let steps = getAllSteps();
        let statusText = document.getElementById('statusText');
        let statusDot = document.getElementById('statusDot');
        let cur = getCurrentStep();

        if(completedSteps.length === steps.length){
            statusText.textContent = 'Пельмени готовы!';
            statusDot.classList.remove('active');
        } else if(cur){
            statusText.textContent = `Шаг ${cur.id} из ${steps.length}: ${cur.title}`;
            statusDot.classList.add('active');
        } else {
            let locked = steps.find(s=>!completedSteps.includes(s.id));
            statusText.textContent = locked ? `Ждём: шаг ${locked.id} пока недоступен` : 'Всё готово!';
            statusDot.classList.remove('active');
        }

        let dotsRow = document.getElementById('dotsRow');
        dotsRow.innerHTML = steps.map(s=>{
            let cls = completedSteps.includes(s.id) ? 'done' : (cur?.id===s.id ? 'current' : '');
            return `<button class="step-dot ${cls}" data-jump="${s.id}" aria-label="Шаг ${s.id}: ${s.title}"></button>`;
        }).join('');
        dotsRow.querySelectorAll('[data-jump]').forEach(btn=>{
            btn.addEventListener('click', ()=>{
                document.querySelector(`.step-card[data-step-id="${btn.dataset.jump}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
            });
        });
        document.getElementById('dotsLabel').textContent = `Выполнено ${completedSteps.length} из ${steps.length} шагов`;
    }

    /* ============================================ */
    /* === ПЛАВАЮЩАЯ ПОДСКАЗКА "ЧТО ДАЛЬШЕ" =========== */
    /* ============================================ */

    function updateFloatPill(){
        let pill = document.getElementById('floatPill');
        let label = document.getElementById('fpLabel');
        let main = document.getElementById('fpMain');
        let time = document.getElementById('fpTime');
        let stop = document.getElementById('fpStop');
        let arrow = document.getElementById('fpArrow');
        let steps = getAllSteps();

        if(currentActiveTimerId && timersState[currentActiveTimerId]?.status==='running'){
            let state = timersState[currentActiveTimerId];
            label.textContent = 'Идёт варка';
            main.textContent = 'Осталось времени';
            time.textContent = formatTime(state.seconds);
            time.style.display='inline';
            stop.style.display='flex';
            arrow.style.display='none';
            pill.classList.add('visible');
            pill.onclick = null;
        } else {
            let cur = getCurrentStep();
            if(cur && completedSteps.length < steps.length){
                label.textContent = 'Далее';
                main.textContent = `Шаг ${cur.id} · ${cur.title}`;
                time.style.display='none';
                stop.style.display='none';
                arrow.style.display='inline';
                pill.classList.add('visible');
                pill.onclick = ()=> document.querySelector(`.step-card[data-step-id="${cur.id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
            } else {
                pill.classList.remove('visible');
                pill.onclick = null;
            }
        }
    }

    /* ============================================ */
    /* === ЗАВЕРШЕНИЕ =============================== */
    /* ============================================ */

    function celebrate(){
        if(typeof confetti === 'function'){
            confetti({particleCount:200, spread:100, origin:{y:0.6}, colors:['#3A3D42','#C96A4B','#F7F5F2']});
        }
        let modal = document.createElement('div');
        modal.className = 'completion-modal';
        modal.innerHTML = `<div class="completion-card"><div class="emoji">🥟✨🧅</div><h3>Готово!</h3><p>Ваши пельмени готовы! Приятного аппетита!</p><button class="completion-btn" onclick="this.closest('.completion-modal').remove()">Отлично!</button></div>`;
        document.body.appendChild(modal);
        setTimeout(()=>modal.remove(), 5000);
    }

    /* ============================================ */
    /* === ПОДШАГИ И ОТМЕТКА ========================= */
    /* ============================================ */

    function allSubstepsDone(stepId){
        let step = getAllSteps().find(s=>s.id===stepId);
        if(!step || !step.substeps) return true;
        let substate = substepsState[stepId] || {};
        return step.substeps.every((_,idx)=>substate[idx]===true);
    }

    function updateSubstep(stepId, idx, checked){
        if(!substepsState[stepId]) substepsState[stepId]={};
        substepsState[stepId][idx]=checked;
        saveAll();

        let allDone = allSubstepsDone(stepId);
        let timerState = timersState[stepId];
        let timerFinished = !getAllSteps().find(s=>s.id===stepId)?.timer || (timerState && timerState.seconds===0);

        if(allDone && timerFinished && !completedSteps.includes(stepId)){
            completedSteps.push(stepId);
            saveAll();
            showToast(`✓ Шаг ${stepId} выполнен!`);
            if(completedSteps.length === getAllSteps().length) celebrate();
        }
        renderSteps();
    }

    function toggleStep(stepId){
        if(completedSteps.includes(stepId)){
            completedSteps = completedSteps.filter(id=>id!==stepId);
            saveAll();
            renderSteps();
            showToast(`Шаг ${stepId} отменён`);
            return;
        }
        if(!allSubstepsDone(stepId)){
            showToast(`⚠️ Выполните все пункты этого шага`);
            return;
        }
        let step = getAllSteps().find(s=>s.id===stepId);
        let timerState = timersState[stepId];
        if(step?.timer && timerState && timerState.seconds > 0 && timerState.status!=='stopped'){
            showToast(`⏲️ Дождитесь окончания варки`);
            return;
        }
        completedSteps.push(stepId);
        saveAll();
        renderSteps();
        showToast(`✓ Шаг ${stepId} готов!`);
        if(completedSteps.length === getAllSteps().length) celebrate();
    }

    /* ============================================ */
    /* === ТАЙМЕР ==================================== */
    /* ============================================ */

    function startTimer(stepId, totalSec){
        if(timersState[stepId] && timersState[stepId].status==='running') return;
        timersState[stepId] = { status:'running', seconds:totalSec, total:totalSec, timestamp:Date.now() };
        saveAll();
        currentActiveTimerId = stepId;
        updateFloatPill();
        showToast(`⏲️ Таймер запущен (${Math.floor(totalSec/60)} мин)`);
        runTimerTick(stepId);
        renderSteps();
    }

    function runTimerTick(stepId){
        let lastUpdate = Date.now();
        function tick(){
            if(document.hidden){ requestAnimationFrame(tick); return; }
            let cur = timersState[stepId];
            if(!cur || cur.status !== 'running') return;

            let now = Date.now();
            let delta = Math.floor((now - lastUpdate)/1000);
            if(delta > 0){
                cur.seconds = Math.max(0, cur.seconds - delta);
                cur.timestamp = now;
                lastUpdate = now;
                saveAll();

                if(cur.seconds <= 0){
                    cur.status = 'stopped';
                    cur.seconds = 0;
                    saveAll();
                    playSound();
                    showToast(`⏰ Таймер завершён! Пельмени сварились`);
                    if(currentActiveTimerId === stepId) currentActiveTimerId = null;

                    if(allSubstepsDone(stepId) && !completedSteps.includes(stepId)){
                        completedSteps.push(stepId);
                        saveAll();
                        showToast(`✓ Шаг ${stepId} автоматически отмечен!`);
                        if(completedSteps.length === getAllSteps().length) celebrate();
                    }
                    renderSteps();
                    updateFloatPill();
                    return;
                }
                updateTimerUI(stepId);
                updateFloatPill();
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    /** Восстанавливает реально прошедшее время после перезагрузки — раньше interval
        сбрасывался вместе со страницей и ни разу не проверялся заново при init(). */
    function resumeTimers(){
        for(let key in timersState){
            let state = timersState[key];
            if(!state || state.status !== 'running' || !state.timestamp) continue;
            let stepId = parseInt(key);
            let elapsed = Math.floor((Date.now() - state.timestamp)/1000);
            state.seconds = Math.max(0, state.seconds - elapsed);
            if(state.seconds <= 0){
                state.status = 'stopped';
                state.seconds = 0;
                if(allSubstepsDone(stepId) && !completedSteps.includes(stepId)){
                    completedSteps.push(stepId);
                }
            } else {
                state.timestamp = Date.now();
                currentActiveTimerId = stepId;
                runTimerTick(stepId);
            }
        }
        saveAll();
    }

    function stopTimer(stepId){
        let state = timersState[stepId];
        if(!state) return;
        state.status = 'stopped';
        state.seconds = state.total;
        delete state.timestamp;
        if(currentActiveTimerId === stepId) currentActiveTimerId = null;
        saveAll();
        renderSteps();
        updateFloatPill();
        showToast(`⏹️ Таймер остановлен`);
    }

    function updateTimerUI(stepId){
        let state = timersState[stepId];
        if(!state) return;
        let disp = document.querySelector(`[data-timer-display="${stepId}"]`);
        if(disp) disp.textContent = formatTime(state.seconds);
        let fill = document.querySelector(`[data-timer-fill="${stepId}"]`);
        if(fill) fill.style.width = (100 - (state.seconds/state.total*100)).toFixed(1) + '%';
        updateFloatPill();
    }

    /* ============================================ */
    /* === ФОТО БЛЮДА ================================= */
    /* ============================================ */

    function resizeImageFile(file, maxDim, quality){
        return new Promise((resolve, reject)=>{
            let reader = new FileReader();
            reader.onload = (e)=>{
                let img = new Image();
                img.onload = ()=>{
                    let width = img.width, height = img.height;
                    if(width > maxDim || height > maxDim){
                        if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
                        else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
                    }
                    let canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = ()=>reject(new Error('Не удалось декодировать изображение'));
                img.src = e.target.result;
            };
            reader.onerror = ()=>reject(new Error('Не удалось прочитать файл'));
            reader.readAsDataURL(file);
        });
    }

    function savePhotos(){
        try{
            localStorage.setItem('pelmeni_photos', JSON.stringify(photos));
        }catch(e){
            console.error('Ошибка сохранения фото (вероятно, переполнено хранилище):', e);
            photos.pop();
            showToast('⚠️ Не хватило места для фото — удалите старые и попробуйте снова');
        }
    }

    function deletePhoto(id){
        photos = photos.filter(p=>p.id!==id);
        savePhotos();
        renderPhotos();
        showToast('Фото удалено');
    }

    function openLightbox(src){
        let overlay = document.createElement('div');
        overlay.className = 'lightbox';
        let img = document.createElement('img');
        img.src = src;
        img.alt = 'Фото блюда';
        let closeBtn = document.createElement('button');
        closeBtn.className = 'lightbox-close';
        closeBtn.setAttribute('aria-label', 'Закрыть');
        closeBtn.innerHTML = '<i class="fas fa-times"></i>';
        overlay.appendChild(img);
        overlay.appendChild(closeBtn);
        overlay.addEventListener('click', (e)=>{ if(e.target===overlay || e.target.closest('.lightbox-close')) overlay.remove(); });
        document.body.appendChild(overlay);
    }

    function renderPhotos(){
        let strip = document.getElementById('photoStrip');
        let hint = document.getElementById('photoEmptyHint');
        if(!strip) return;

        let html = '';
        photos.forEach(p=>{
            html += `<div class="photo-thumb" data-photo-id="${p.id}"><button class="photo-delete" data-photo-delete="${p.id}" aria-label="Удалить фото"><i class="fas fa-times"></i></button></div>`;
        });
        html += `<label class="photo-add" for="photoInput"><i class="fas fa-plus"></i><span>Добавить</span></label>`;
        strip.innerHTML = html;

        strip.querySelectorAll('.photo-thumb').forEach(el=>{
            let id = el.dataset.photoId;
            let photo = photos.find(p=>p.id===id);
            if(photo) el.style.backgroundImage = `url(${photo.src})`;
            el.addEventListener('click', (e)=>{
                if(e.target.closest('.photo-delete')) return;
                if(photo) openLightbox(photo.src);
            });
        });
        strip.querySelectorAll('[data-photo-delete]').forEach(btn=>{
            btn.addEventListener('click', (e)=>{ e.stopPropagation(); deletePhoto(btn.dataset.photoDelete); });
        });

        if(hint) hint.style.display = photos.length ? 'none' : 'flex';
    }

    /* ============================================ */
    /* === ИНГРЕДИЕНТЫ ================================ */
    /* ============================================ */

    function renderIngredients(){
        let container = document.getElementById('ingredientsContainer');
        let cats = [...new Set(INGREDIENTS_BASE.items.map(i=>i.category))];
        let html = '';
        cats.forEach(cat=>{
            html += `<div class="ing-category">${cat}</div>`;
            INGREDIENTS_BASE.items.filter(i=>i.category===cat).forEach(ing=>{
                let rawAmt = (ing.baseAmount/INGREDIENTS_BASE.basePortions)*portions;
                let f = formatAmount(rawAmt, ing.unit);
                let ch = checkedIngredients.includes(ing.id);
                html += `<div class="ingredient-item ${ch?'checked':''}" data-ing-id="${ing.id}"><input type="checkbox" ${ch?'checked':''}><span class="ingredient-name">${ing.name}</span><span class="ingredient-amount">${f.amount} ${f.unit}</span></div>`;
            });
        });
        container.innerHTML = html;
        document.querySelectorAll('.ingredient-item').forEach(el=>{
            let cb = el.querySelector('input');
            let id = el.dataset.ingId;
            cb.addEventListener('change', ()=>{
                if(cb.checked){ if(!checkedIngredients.includes(id)) checkedIngredients.push(id); el.classList.add('checked'); }
                else{ checkedIngredients = checkedIngredients.filter(i=>i!==id); el.classList.remove('checked'); }
                saveAll();
            });
            el.addEventListener('click', (e)=>{ if(e.target!==cb) cb.click(); });
        });
    }

    function updatePortions(delta){
        let old = portions;
        portions = clampPortions(portions + delta);
        maybeJokeAboutPortions(portions, old);
        document.getElementById('portionsInput').value = portions;
        renderIngredients();
        saveAll();
    }

    /* ============================================ */
    /* === ОТРИСОВКА ШАГОВ ============================ */
    /* ============================================ */

    function renderSteps(){
        let container = document.getElementById('stepsContainer');
        if(!container) return;
        let steps = getAllSteps();
        let curGroup = '', html = '';
        let curStep = getCurrentStep();

        steps.forEach((step, i)=>{
            if(step.group !== curGroup){ curGroup = step.group; html += `<div class="step-group-title">${step.group}</div>`; }

            let isDone = completedSteps.includes(step.id);
            let isLocked = !isStepAvailable(step) && !isDone;
            let isCurrent = curStep?.id === step.id;
            let timerState = timersState[step.id];
            let isTimerActive = timerState && timerState.status === 'running';
            let substate = substepsState[step.id] || {};

            let substepsHtml = '<div class="substeps">';
            step.substeps.forEach((sub, idx)=>{
                let ch = substate[idx] === true;
                substepsHtml += `<div class="substep ${ch?'checked':''}"><input type="checkbox" class="substep-cb" data-step="${step.id}" data-idx="${idx}" ${ch?'checked':''} ${isLocked||isDone?'disabled':''}><span>${sub}</span></div>`;
            });
            substepsHtml += '</div>';

            let timerHtml = '';
            if(step.timer){
                if(isTimerActive){
                    let currSec = timerState.seconds;
                    let pct = (100 - (currSec/timerState.total*100));
                    timerHtml = `<div class="timer-control"><div class="timer-active">
                        <span class="timer-time" data-timer-display="${step.id}">${formatTime(currSec)}</span>
                        <div class="timer-progress-track"><div class="timer-progress-fill" data-timer-fill="${step.id}" style="width:${pct.toFixed(1)}%"></div></div>
                        <button class="timer-icon-btn" data-timer-stop="${step.id}" aria-label="Остановить таймер"><i class="fas fa-stop"></i></button>
                    </div></div>`;
                } else if(!isDone && !isLocked){
                    timerHtml = `<div class="timer-control"><button class="timer-btn" data-timer-start="${step.id}"><i class="fas fa-hourglass-start"></i> Запустить таймер (${step.timer.label})</button></div>`;
                }
            }

            let cardClasses = `step-card ${isDone?'done':''} ${isLocked?'locked':''} ${isCurrent?'current':''} ${firstStepsRender?'enter':''}`;
            let cardStyle = firstStepsRender ? `style="animation-delay:${Math.min(i*30,300)}ms"` : '';

            html += `<div class="${cardClasses}" data-step-id="${step.id}" ${cardStyle}>
                <div class="step-content">
                    <div class="step-header">
                        <div class="step-number">${step.id}</div>
                        <div class="step-title">${step.title}</div>
                        ${step.timer ? `<div class="step-timer-badge"><i class="far fa-clock"></i> ${step.timer.label}</div>` : ''}
                        ${isCurrent?'<span class="current-tag">Сейчас</span>':''}
                    </div>
                    <div class="step-desc">${step.desc}</div>
                    ${substepsHtml}
                    ${timerHtml}
                </div>
                <button class="step-done-btn" data-step-toggle="${step.id}" ${isDone||isLocked?'disabled':''}>
                    ${isDone?'<i class="fas fa-check-circle"></i> Готово':'<i class="far fa-check-circle"></i> Отметить выполненным'}
                </button>
            </div>`;
        });

        container.innerHTML = html;
        firstStepsRender = false;

        document.querySelectorAll('[data-step-toggle]').forEach(btn=>btn.addEventListener('click', ()=>toggleStep(parseInt(btn.dataset.stepToggle))));
        document.querySelectorAll('[data-timer-start]').forEach(btn=>btn.addEventListener('click', ()=>{
            let sid = parseInt(btn.dataset.timerStart);
            let s = getAllSteps().find(s=>s.id===sid);
            if(s?.timer) startTimer(sid, s.timer.duration);
        }));
        document.querySelectorAll('[data-timer-stop]').forEach(btn=>btn.addEventListener('click', ()=>stopTimer(parseInt(btn.dataset.timerStop))));
        document.querySelectorAll('.substep-cb').forEach(cb=>cb.addEventListener('change', function(){
            updateSubstep(parseInt(this.dataset.step), parseInt(this.dataset.idx), this.checked);
        }));

        updateStatusAndDots();
        updateFloatPill();
    }

    /* ============================================ */
    /* === СБРОС ======================================= */
    /* ============================================ */

    function resetAll(){
        if(confirm('🥟 Сбросить весь прогресс приготовления?')){
            completedSteps=[]; checkedIngredients=[]; substepsState={}; timersState={};
            currentActiveTimerId=null; portions=INGREDIENTS_BASE.basePortions;
            document.getElementById('portionsInput').value = portions;
            saveAll();
            renderIngredients();
            renderSteps();
            updateFloatPill();
            showToast('Прогресс сброшен');
        }
    }

    /* ============================================ */
    /* === ТЁМНАЯ ТЕМА ================================= */
    /* ============================================ */

    function applyTheme(){
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }

    /* ============================================ */
    /* === WAKE LOCK =================================== */
    /* ============================================ */

    function initWakeLock(){
        let btn = document.getElementById('wakeLockBtn');
        if(!('wakeLock' in navigator)){ btn.style.display = 'none'; return; }
        btn.addEventListener('click', async ()=>{
            if(!wakeLock){
                try{
                    wakeLock = await navigator.wakeLock.request('screen');
                    btn.classList.add('active');
                    btn.innerHTML = '<i class="fas fa-check"></i> Экран активен';
                    wakeLock.addEventListener('release', ()=>{
                        wakeLock = null;
                        btn.classList.remove('active');
                        btn.innerHTML = '<i class="fas fa-sun"></i> Экран не гаснет';
                    });
                }catch(e){ showToast('Не удалось активировать'); }
            } else {
                wakeLock.release();
            }
        });
    }

    /* ============================================ */
    /* === ИНИЦИАЛИЗАЦИЯ ================================ */
    /* ============================================ */

    function init(){
        applyTheme();
        let wasReset = checkAutoReset();

        document.getElementById('portionsInput').value = portions;
        if(!wasReset) resumeTimers();

        updateMethodUI();
        renderIngredients();
        renderSteps();
        renderPhotos();

        document.getElementById('photoInput').addEventListener('change', async function(){
            let files = Array.from(this.files || []);
            for(let file of files){
                if(!file.type.startsWith('image/')) continue;
                try{
                    let dataUrl = await resizeImageFile(file, 1200, 0.82);
                    photos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), src: dataUrl });
                }catch(e){
                    console.error('Ошибка обработки фото:', e);
                    showToast('⚠️ Не удалось обработать одно из фото');
                }
            }
            savePhotos();
            renderPhotos();
            this.value = '';
        });

        document.querySelectorAll('.method-btn').forEach(btn=>{
            btn.addEventListener('click', ()=>setMethod(btn.dataset.method));
        });

        document.getElementById('portMinus').addEventListener('click', ()=>updatePortions(-1));
        document.getElementById('portPlus').addEventListener('click', ()=>updatePortions(1));
        document.getElementById('portionsInput').addEventListener('change', function(){
            let old = portions;
            portions = clampPortions(parseInt(this.value));
            maybeJokeAboutPortions(portions, old);
            this.value = portions;
            renderIngredients();
            saveAll();
        });

        document.getElementById('resetBtn').addEventListener('click', resetAll);

        document.getElementById('startBtn').addEventListener('click', ()=>{
            let cur = getCurrentStep();
            let target = cur ? document.querySelector(`.step-card[data-step-id="${cur.id}"]`) : document.querySelector('.footer');
            target?.scrollIntoView({behavior:'smooth', block:'center'});
        });

        document.getElementById('scrollTop').addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));
        document.getElementById('scrollTop').addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); window.scrollTo({top:0, behavior:'smooth'}); } });
        document.getElementById('fpStop').addEventListener('click', (e)=>{ e.stopPropagation(); if(currentActiveTimerId) stopTimer(currentActiveTimerId); });

        document.getElementById('themeBtn').addEventListener('click', ()=>{
            isDark = !isDark;
            localStorage.setItem('pelmeni_theme', isDark ? 'dark' : 'light');
            applyTheme();
        });

        window.addEventListener('scroll', ()=>{
            document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 200);
        });

        initWakeLock();
    }

    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
