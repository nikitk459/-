<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="description" content="Гороховый суп с копчёностями — сытный деревенский рецепт">
    <meta name="theme-color" content="#8b5a2b">
    <title>🥣 Гороховый суп с копчёностями | Деревенский рецепт</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --wood-dark: #6B3E1C;
            --wood-medium: #9B5E2E;
            --wood-light: #C68B54;
            --cream: #FDF5E8;
            --cream-dark: #F0E0D0;
            --text-dark: #3D2A1A;
            --text-soft: #7A5A3A;
            --border: #E8D8C0;
            --success: #7BA05B;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --radius-card: 28px;
        }

        body {
            background: linear-gradient(145deg, #C49A6C 0%, #A87A4E 100%);
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            position: relative;
        }

        /* Текстура дерева */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* Декоративные ложки */
        .soup-deco {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 60px;
            opacity: 0.06;
            pointer-events: none;
            transform: rotate(-15deg);
        }

        .app {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 768px) { .app { padding: 36px; } }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding: 12px 24px;
            background: rgba(253, 245, 232, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(139, 90, 43, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon { font-size: 42px; animation: spoonWiggle 3s infinite; }
        @keyframes spoonWiggle {
            0%, 100% { transform: rotate(0deg); }
            30% { transform: rotate(-5deg); }
            70% { transform: rotate(5deg); }
        }
        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--wood-dark);
        }
        .logo-text span { color: var(--wood-medium); }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--wood-medium);
            border-radius: 40px;
            padding: 8px 18px;
            color: var(--wood-dark);
            cursor: pointer;
            transition: 0.2s;
        }
        .theme-btn:hover { background: var(--wood-medium); color: white; }

        .hero {
            text-align: center;
            margin-bottom: 28px;
            background: rgba(253, 245, 232, 0.8);
            border-radius: 48px;
            padding: 28px 20px;
            border-bottom: 3px solid var(--wood-light);
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 700;
            color: var(--wood-dark);
        }
        @media (min-width: 600px) { .hero h1 { font-size: 64px; } }
        .hero p {
            color: var(--text-soft);
            margin-top: 8px;
            font-style: italic;
        }
        .hero-badge {
            display: inline-block;
            background: var(--wood-light);
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 13px;
            margin-top: 14px;
            font-weight: 600;
        }

        .start-btn {
            background: var(--wood-medium);
            border: none;
            border-radius: 60px;
            padding: 16px 28px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: white;
            font-weight: 600;
            font-size: 20px;
            cursor: pointer;
            margin-bottom: 28px;
            font-family: 'Playfair Display', serif;
            box-shadow: 0 8px 20px rgba(139, 90, 43, 0.3);
            transition: 0.2s;
        }
        .start-btn:hover { background: var(--wood-dark); transform: translateY(-3px); }

        .progress-card {
            background: rgba(253, 245, 232, 0.95);
            border-radius: 32px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border-left: 5px solid var(--wood-light);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }
        .progress-percent {
            font-size: 34px;
            font-weight: 700;
            color: var(--wood-dark);
            font-family: 'Playfair Display', serif;
        }
        .progress-bar-bg {
            height: 8px;
            background: rgba(139, 90, 43, 0.2);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0 8px;
        }
        .progress-fill {
            height: 100%;
            background: var(--wood-light);
            border-radius: 20px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .ingredients-card {
            background: rgba(253, 245, 232, 0.95);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            border-right: 4px solid var(--wood-light);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }
        .card-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            color: var(--wood-dark);
        }
        .portion-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 4px 16px;
            border-radius: 60px;
        }
        .portion-control button {
            background: var(--wood-medium);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .portion-input {
            width: 48px;
            text-align: center;
            border: none;
            font-weight: 600;
            font-size: 18px;
            background: transparent;
        }
        .group-title {
            font-weight: 600;
            color: var(--wood-medium);
            margin: 16px 0 8px;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .ingredient-item {
            background: white;
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(139, 90, 43, 0.2);
            cursor: pointer;
            transition: 0.15s;
        }
        .ingredient-item:hover { transform: translateX(4px); border-color: var(--wood-light); }
        .ingredient-item input { width: 20px; height: 20px; accent-color: var(--wood-medium); pointer-events: none; }
        .ingredient-name { flex: 1; font-weight: 500; }
        .ingredient-amount { background: #F0E0D0; padding: 4px 12px; border-radius: 40px; font-size: 13px; color: var(--wood-dark); }
        .ingredient-item.checked { opacity: 0.65; background: #F0E0D0; }
        .ingredient-item.checked .ingredient-name { text-decoration: line-through; }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: rgba(253, 245, 232, 0.95);
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 28px;
        }
        .control-check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
        .reset-btn {
            background: white;
            color: var(--wood-dark);
            border: 1px solid var(--wood-light);
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .reset-btn:hover { background: var(--wood-light); color: white; }

        .step-group-title {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            color: var(--wood-dark);
            margin: 32px 0 16px;
            border-bottom: 3px dotted var(--wood-light);
            display: inline-block;
        }
        @media (min-width: 600px) { .step-group-title { font-size: 44px; } }

        .step-card {
            background: white;
            border-radius: 32px;
            margin-bottom: 16px;
            transition: 0.2s;
            box-shadow: var(--shadow-sm);
            border-top: 1px solid rgba(139, 90, 43, 0.15);
            position: relative;
        }
        .step-card.locked {
            opacity: 0.65;
            background: #F8F5F0;
        }
        .step-card.locked::after {
            content: "🔒";
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 20px;
            opacity: 0.7;
        }
        .step-card.done {
            border-left: 4px solid var(--success);
            background: #F5F8F0;
        }
        .step-card.hidden { display: none; }
        .step-content { padding: 20px; }
        .step-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .step-number {
            background: var(--wood-light);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
        }
        .step-title { font-weight: 600; font-size: 18px; flex: 1; }
        .step-timer-badge {
            background: rgba(198, 139, 84, 0.15);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 13px;
            color: var(--wood-medium);
        }
        .step-desc { color: var(--text-soft); margin-bottom: 14px; padding-left: 62px; font-size: 13px; }
        .substeps { padding-left: 62px; margin-bottom: 16px; }
        .substep { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 14px; }
        .substep input { accent-color: var(--wood-medium); cursor: pointer; }
        .substep.checked span { text-decoration: line-through; opacity: 0.65; }
        .timer-btn {
            background: #F0E0D0;
            border: 1px solid var(--wood-light);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 10px;
            color: var(--wood-dark);
        }
        .step-done-btn {
            width: calc(100% - 40px);
            margin: 0 20px 20px 20px;
            background: transparent;
            border: 1.5px solid var(--wood-light);
            padding: 10px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            color: var(--wood-dark);
        }
        .step-done-btn:hover:not(:disabled) { background: var(--wood-light); color: white; }
        .step-done-btn:disabled { background: var(--success); color: white; border-color: var(--success); }

        .floating-timer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(61, 42, 26, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transform: translateY(150%);
            transition: transform 0.4s ease;
            z-index: 200;
            max-width: 380px;
            margin: 0 auto;
            border-left: 4px solid var(--wood-light);
        }
        .floating-timer.visible { transform: translateY(0); }
        .floating-timer-time { font-family: monospace; font-size: 24px; font-weight: 800; color: var(--wood-light); }
        .floating-timer-stop { background: rgba(255,255,255,0.1); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }

        .scroll-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 46px;
            height: 46px;
            background: var(--wood-medium);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
            color: white;
            z-index: 100;
        }
        .scroll-top.visible { opacity: 1; visibility: visible; }

        .wake-btn {
            width: 100%;
            background: var(--wood-dark);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 60px;
            margin-top: 20px;
            font-weight: 600;
            cursor: pointer;
        }
        .wake-btn:hover { background: var(--wood-medium); }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 20px;
            right: 20px;
            background: rgba(61, 42, 26, 0.95);
            color: white;
            padding: 10px 18px;
            border-radius: 60px;
            text-align: center;
            font-size: 13px;
            z-index: 300;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.25s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        .footer {
            text-align: center;
            margin: 40px 0 20px;
            font-size: 28px;
            font-family: 'Playfair Display', serif;
            color: var(--wood-dark);
        }
    </style>
</head>
<body>
<div class="soup-deco">🥣🍲🔥</div>

<div class="app">
    <div class="header">
        <div class="logo">
            <span class="logo-icon">🥣</span>
            <span class="logo-text">Гороховый <span>суп</span></span>
        </div>
        <button class="theme-btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div class="hero">
        <h1>Гороховый суп<br>с копчёностями</h1>
        <p>🥣 сытный, ароматный, как в деревне у бабушки 🥓</p>
        <div class="hero-badge"><i class="fas fa-heart"></i> Домашний рецепт</div>
    </div>

    <button class="start-btn" id="startBtn"><i class="fas fa-arrow-down"></i> Начать готовить</button>

    <div class="progress-card">
        <div class="progress-header"><span>🥣 Прогресс</span><span class="progress-percent" id="progressPercent">0%</span></div>
        <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
        <div class="steps-count" id="stepsCounter">Выполнено 0 из 10 шагов</div>
    </div>

    <div class="ingredients-card">
        <div class="card-header"><h2><i class="fas fa-basket-shopping"></i> Ингредиенты</h2>
            <div class="portion-control"><button id="portMinus">-</button><input type="text" id="portionsInput" value="4" class="portion-input"><button id="portPlus">+</button><span>порц</span></div>
        </div>
        <div id="ingredientsContainer"></div>
        <button class="wake-btn" id="wakeLockBtn"><i class="fas fa-sun"></i> Экран не гаснет</button>
    </div>

    <div class="control-panel">
        <label class="control-check"><input type="checkbox" id="hideDoneCheckbox"> <i class="fas fa-eye-slash"></i> Скрыть готовые шаги</label>
        <label class="control-check"><input type="checkbox" id="autoCheckbox" checked> <i class="far fa-check-circle"></i> Автоотметка</label>
        <button class="reset-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Сбросить всё</button>
    </div>

    <div id="stepsContainer"></div>
    <div class="footer">🥣 Сытного аппетита! 🥓</div>
</div>

<div class="floating-timer" id="floatingTimer">
    <div><span id="floatingTimerName">Таймер</span><br><span class="floating-timer-time" id="floatingTimerTime">00:00</span></div>
    <button class="floating-timer-stop" id="floatingTimerStop"><i class="fas fa-stop"></i></button>
</div>
<div class="scroll-top" id="scrollTop"><i class="fas fa-arrow-up"></i></div>
<div id="toast" class="toast"></div>
<audio id="alarmAudio" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
(function(){
    const AUTO_RESET_SECONDS = 12 * 3600;
    
    const INGREDIENTS_BASE = {
        basePortions: 4,
        items: [
            { id: 'ing1', name: 'Горох колотый', baseAmount: 400, unit: 'г', category: '🌾 Основа' },
            { id: 'ing2', name: 'Копчёные рёбрышки', baseAmount: 700, unit: 'г', category: '🥩 Основа' },
            { id: 'ing3', name: 'Вода', baseAmount: 3000, unit: 'мл', category: '💧 Основа' },
            { id: 'ing4', name: 'Лук репчатый', baseAmount: 2, unit: 'шт', category: '🧅 Овощи' },
            { id: 'ing5', name: 'Морковь', baseAmount: 2, unit: 'шт', category: '🥕 Овощи' },
            { id: 'ing6', name: 'Картофель', baseAmount: 4, unit: 'шт', category: '🥔 Овощи' },
            { id: 'ing7', name: 'Чеснок', baseAmount: 3, unit: 'зубчика', category: '🧄 Овощи' },
            { id: 'ing8', name: 'Лавровый лист', baseAmount: 2, unit: 'шт', category: '🌿 Специи' },
            { id: 'ing9', name: 'Перец горошком', baseAmount: 10, unit: 'шт', category: '🌿 Специи' },
            { id: 'ing10', name: 'Соль', baseAmount: 1, unit: 'по вкусу', category: '🧂 Специи' },
            { id: 'ing11', name: 'Масло растительное', baseAmount: 3, unit: 'ст.л.', category: '🫒 Подача' },
            { id: 'ing12', name: 'Зелень', baseAmount: 1, unit: 'пучок', category: '🌿 Подача' }
        ]
    };

    const STEPS = [
        { id: 1, title: 'Замочить горох', desc: 'Горох промыть, залить холодной водой и оставить набухать минимум на 2 часа', group: '🌾 Подготовка', timer: { duration: 7200, label: '2 часа' }, substeps: ['Промыть горох', 'Залить холодной водой', 'Оставить на 2 часа'], requires: [] },
        { id: 2, title: 'Подготовить мясо', desc: 'Копчёные рёбрышки разрубить на куски', group: '🌾 Подготовка', substeps: ['Разрубить рёбрышки на куски', 'Удалить лишний жир при желании'], requires: [1] },
        { id: 3, title: 'Нарезка овощей', desc: 'Лук и морковь очистить', group: '🌾 Подготовка', substeps: ['Очистить лук и морковь', 'Одну луковицу и одну морковь оставить целыми', 'Остальные нарезать мелкими кубиками'], requires: [1] },
        { id: 4, title: 'Подготовка картофеля', desc: 'Картофель очистить и нарезать', group: '🌾 Подготовка', substeps: ['Очистить картофель', 'Нарезать кубиками 1-1.5 см', 'Залить холодной водой'], requires: [1] },
        { id: 5, title: 'Сварить бульон', desc: 'Слить воду с гороха, залить свежей водой с мясом и овощами', group: '🔥 Варка', substeps: ['Слить воду с гороха', 'Положить рёбрышки, горох, целые лук и морковь', 'Залить 3 литрами воды', 'Довести до кипения, снять пену'], requires: [2,3,4] },
        { id: 6, title: 'Варить бульон', desc: 'Убавить огонь и варить 1 час', group: '🔥 Варка', timer: { duration: 3600, label: '1 час' }, substeps: ['Убавить огонь до слабого кипения', 'Варить под крышкой 1 час', 'Периодически помешивать'], requires: [5] },
        { id: 7, title: 'Удалить овощи', desc: 'Вынуть из бульона целые лук и морковь', group: '🔥 Варка', substeps: ['Вынуть целые лук и морковь', 'Они больше не нужны'], requires: [6] },
        { id: 8, title: 'Обжарить зажарку', desc: 'На сковороде обжарить нарезанные лук и морковь', group: '🔥 Варка', substeps: ['Разогреть сковороду с маслом', 'Обжарить лук и морковь до золотистого цвета'], requires: [6] },
        { id: 9, title: 'Добавить картофель и зажарку', desc: 'Положить картофель, варить 15-20 минут, затем добавить зажарку и специи', group: '🔥 Варка', substeps: ['Добавить картофель в суп', 'Варить 15-20 минут до мягкости', 'Добавить зажарку, лавровый лист, перец, чеснок'], requires: [7,8] },
        { id: 10, title: 'Финальная варка', desc: 'Проварить всё вместе, посолить, дать настояться', group: '🍽️ Подача', timer: { duration: 600, label: '10 мин' }, substeps: ['Проварить 10 минут', 'Посолить по вкусу', 'Выключить и дать настояться 20-30 минут'], requires: [9] }
    ];

    let portions = Math.min(50, Math.max(2, parseInt(localStorage.getItem('peasoup_portions')) || 4));
    let checkedIngredients = JSON.parse(localStorage.getItem('peasoup_ingredients') || '[]');
    let completedSteps = JSON.parse(localStorage.getItem('peasoup_steps') || '[]');
    let substepsState = JSON.parse(localStorage.getItem('peasoup_substeps') || '{}');
    let timersState = JSON.parse(localStorage.getItem('peasoup_timers') || '{}');
    let timerIntervals = {};
    let currentActiveTimerId = null;
    let wakeLock = null;
    let lastActivity = localStorage.getItem('peasoup_last_activity');
    let isDark = localStorage.getItem('peasoup_theme') === 'dark';

    function isStepAvailable(step) {
        if (completedSteps.includes(step.id)) return false;
        if (!step.requires || step.requires.length === 0) return true;
        return step.requires.every(reqId => completedSteps.includes(reqId));
    }

    function saveAll() {
        localStorage.setItem('peasoup_ingredients', JSON.stringify(checkedIngredients));
        localStorage.setItem('peasoup_steps', JSON.stringify(completedSteps));
        localStorage.setItem('peasoup_timers', JSON.stringify(timersState));
        localStorage.setItem('peasoup_substeps', JSON.stringify(substepsState));
        localStorage.setItem('peasoup_last_activity', Date.now().toString());
        localStorage.setItem('peasoup_portions', portions);
    }

    function showToast(msg) {
        let t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    function playSound() {
        let audio = document.getElementById('alarmAudio');
        if(audio) audio.play().catch(()=>{});
        if(navigator.vibrate) navigator.vibrate(200);
    }

    function formatTime(sec) { 
        if (sec >= 3600) {
            let h = Math.floor(sec / 3600);
            let m = Math.floor((sec % 3600) / 60);
            return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        }
        let m = Math.floor(sec / 60);
        let s = sec % 60;
        return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function checkAutoReset() {
        if(lastActivity) {
            let diff = (Date.now() - parseInt(lastActivity)) / 1000;
            if(diff >= AUTO_RESET_SECONDS) {
                completedSteps = []; checkedIngredients = []; substepsState = {}; timersState = {};
                currentActiveTimerId = null; portions = 4;
                document.getElementById('portionsInput').value = portions;
                saveAll();
                renderIngredients(); renderSteps(); updateProgress();
                document.getElementById('floatingTimer').classList.remove('visible');
                showToast('🥣 Новый день — новый суп! Прогресс обновлён');
                return true;
            }
        }
        return false;
    }

    function renderIngredients() {
        const container = document.getElementById('ingredientsContainer');
        let cats = [...new Set(INGREDIENTS_BASE.items.map(i=>i.category))];
        let html = '';
        cats.forEach(cat => {
            html += `<div class="group-title">${cat}</div>`;
            INGREDIENTS_BASE.items.filter(i=>i.category===cat).forEach(ing => {
                let amount = (ing.baseAmount / INGREDIENTS_BASE.basePortions) * portions;
                let unit = ing.unit;
                let display;
                if ((unit === 'г' || unit === 'мл') && amount >= 1000) {
                    display = Math.round((amount / 1000) * 10) / 10;
                    unit = unit === 'г' ? 'кг' : 'л';
                } else {
                    display = Number.isInteger(amount) ? amount : amount.toFixed(1);
                }
                let checked = checkedIngredients.includes(ing.id);
                html += `<div class="ingredient-item ${checked ? 'checked' : ''}" data-ing-id="${ing.id}"><input type="checkbox" ${checked ? 'checked' : ''}><span class="ingredient-name">${ing.name}</span><span class="ingredient-amount">${display} ${unit}</span></div>`;
            });
        });
        container.innerHTML = html;
        document.querySelectorAll('.ingredient-item').forEach(el => {
            let cb = el.querySelector('input');
            let id = el.dataset.ingId;
            cb.addEventListener('change', () => {
                if(cb.checked) { if(!checkedIngredients.includes(id)) checkedIngredients.push(id); el.classList.add('checked'); }
                else { checkedIngredients = checkedIngredients.filter(i=>i!==id); el.classList.remove('checked'); }
                saveAll();
            });
            el.addEventListener('click', (e) => { if(e.target !== cb) cb.click(); });
        });
    }

    function updatePortions(delta) {
        portions = Math.min(50, Math.max(2, portions+delta));
        document.getElementById('portionsInput').value = portions;
        renderIngredients();
        showToast(`🍽️ Порций: ${portions}`);
    }

    function allSubstepsDone(stepId) {
        let step = STEPS.find(s=>s.id===stepId);
        if(!step || !step.substeps) return true;
        let substate = substepsState[stepId] || {};
        return step.substeps.every((_,idx)=> substate[idx] === true);
    }

    function updateSubstep(stepId, idx, checked) {
        if(!substepsState[stepId]) substepsState[stepId]={};
        substepsState[stepId][idx]=checked;
        saveAll();
        let allDone = allSubstepsDone(stepId);
        if(allDone && !completedSteps.includes(stepId)) {
            completedSteps.push(stepId);
            saveAll();
            renderSteps();
            updateProgress();
            showToast(`✓ Шаг ${stepId} выполнен!`);
            if(completedSteps.length === STEPS.length) celebrate();
        } else { renderSteps(); }
    }

    function toggleStep(stepId) {
        if(completedSteps.includes(stepId)) {
            completedSteps = completedSteps.filter(id=>id!==stepId);
            saveAll(); renderSteps(); updateProgress();
            showToast(`Шаг ${stepId} отменён`);
        } else {
            if(!allSubstepsDone(stepId)) { showToast(`⚠️ Выполните все подшаги!`); return; }
            completedSteps.push(stepId);
            saveAll(); renderSteps(); updateProgress();
            showToast(`✓ Шаг ${stepId} готов!`);
            if(completedSteps.length === STEPS.length) celebrate();
        }
    }

    function celebrate() {
        if (typeof confetti === 'function') {
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors: ['#C68B54', '#9B5E2E', '#7BA05B'] });
        }
        let modal = document.createElement('div');
        modal.className = 'completion-modal';
        modal.style.cssText = 'position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:2000; display:flex; align-items:center; justify-content:center;';
        modal.innerHTML = `<div style="background:white; border-radius:48px; padding:32px; text-align:center; max-width:320px;"><div style="font-size:64px;">🥣✨🥓</div><h3 style="font-family:Playfair Display; font-size:36px; color:#6B3E1C;">Готово!</h3><p>Ваш гороховый суп готов!<br>Сытного аппетита!</p><button onclick="this.closest('.completion-modal').remove()" style="background:#9B5E2E; border:none; padding:10px 28px; border-radius:40px; color:white; font-size:18px; cursor:pointer;">Отлично!</button></div>`;
        document.body.appendChild(modal);
        setTimeout(()=>modal.remove(),5000);
    }

    function startTimer(stepId, totalSec) {
        if(timersState[stepId] && timersState[stepId].status === 'running') return;
        if(timerIntervals[stepId]) clearInterval(timerIntervals[stepId]);
        timersState[stepId] = { status: 'running', seconds: totalSec, total: totalSec, timestamp: Date.now() };
        saveAll();
        currentActiveTimerId = stepId;
        updateFloatingTimer();
        showToast(`⏲️ Таймер запущен (${Math.floor(totalSec/60)} мин)`);
        timerIntervals[stepId] = setInterval(() => {
            let cur = timersState[stepId];
            if(!cur || cur.status !== 'running') { clearInterval(timerIntervals[stepId]); return; }
            let elapsed = Math.floor((Date.now() - cur.timestamp)/1000);
            cur.seconds = Math.max(0, cur.total - elapsed);
            if(cur.seconds <= 0) {
                clearInterval(timerIntervals[stepId]);
                cur.status = 'stopped';
                saveAll();
                playSound();
                showToast(`⏰ Таймер завершён! Шаг ${stepId}`);
                if(currentActiveTimerId === stepId) currentActiveTimerId = null;
                let auto = document.getElementById('autoCheckbox')?.checked;
                if(auto && allSubstepsDone(stepId) && !completedSteps.includes(stepId)) {
                    completedSteps.push(stepId);
                    saveAll();
                    updateProgress();
                    showToast(`✓ Шаг ${stepId} автоматически отмечен!`);
                    if(completedSteps.length === STEPS.length) celebrate();
                }
                renderSteps();
                updateFloatingTimer();
            }
            updateTimerUI(stepId);
        }, 200);
        renderSteps();
    }

    function resumeTimers() {
        for (let key in timersState) {
            let state = timersState[key];
            if (!state || state.status !== 'running' || !state.timestamp) continue;
            let stepId = parseInt(key, 10);
            let elapsed = Math.floor((Date.now() - state.timestamp) / 1000);
            state.seconds = Math.max(0, state.total - elapsed);
            if (state.seconds <= 0) {
                state.status = 'stopped';
                state.seconds = 0;
                if (allSubstepsDone(stepId) && !completedSteps.includes(stepId)) {
                    completedSteps.push(stepId);
                }
            } else {
                state.timestamp = Date.now();
                if (timerIntervals[stepId]) clearInterval(timerIntervals[stepId]);
                timerIntervals[stepId] = setInterval(() => {
                    let cur = timersState[stepId];
                    if (!cur || cur.status !== 'running') { clearInterval(timerIntervals[stepId]); return; }
                    let el = Math.floor((Date.now() - cur.timestamp) / 1000);
                    cur.seconds = Math.max(0, cur.total - el);
                    if (cur.seconds <= 0) {
                        clearInterval(timerIntervals[stepId]);
                        cur.status = 'stopped';
                        saveAll();
                        playSound();
                        showToast(`⏰ Таймер завершён — шаг ${stepId}`);
                        if (allSubstepsDone(stepId) && !completedSteps.includes(stepId)) {
                            completedSteps.push(stepId);
                            saveAll();
                            if (completedSteps.length === STEPS.length) celebrate();
                        }
                        renderSteps();
                        updateFloatPill();
                    }
                    updateTimerUI(stepId);
                    updateFloatPill();
                }, 200);
            }
        }
        saveAll();
    }

    function stopTimer(stepId) {
        let state = timersState[stepId];
        if(!state) return;
        state.status = 'stopped';
        state.seconds = state.total;
        delete state.timestamp;
        clearInterval(timerIntervals[stepId]);
        saveAll();
        if(currentActiveTimerId === stepId) currentActiveTimerId = null;
        renderSteps();
        updateFloatingTimer();
        showToast(`⏹️ Таймер остановлен`);
    }

    function updateTimerUI(stepId) {
        let state = timersState[stepId];
        let disp = document.querySelector(`[data-timer-display="${stepId}"]`);
        if(disp && state) disp.textContent = formatTime(state.seconds);
        updateFloatingTimer();
    }

    function updateFloatingTimer() {
        let fl = document.getElementById('floatingTimer');
        if(currentActiveTimerId && timersState[currentActiveTimerId] && timersState[currentActiveTimerId].status === 'running') {
            let st = timersState[currentActiveTimerId];
            let step = STEPS.find(s=>s.id===currentActiveTimerId);
            document.getElementById('floatingTimerName').innerHTML = `<i class="fas fa-hourglass-half"></i> ${step?.title || 'Таймер'}`;
            document.getElementById('floatingTimerTime').innerText = formatTime(st.seconds);
            fl.classList.add('visible');
        } else { fl.classList.remove('visible'); }
    }

    function renderSteps() {
        let container = document.getElementById('stepsContainer');
        let curGroup = '', html = '';
        STEPS.forEach(step => {
            if(step.group !== curGroup) { curGroup = step.group; html += `<div class="step-group-title">${step.group}</div>`; }
            let isDone = completedSteps.includes(step.id);
            let isLocked = !isStepAvailable(step) && !isDone;
            let timerState = timersState[step.id];
            let isTimerActive = timerState && timerState.status === 'running';
            let substate = substepsState[step.id] || {};
            let substepsHtml = '<div class="substeps">';
            step.substeps.forEach((sub, idx) => {
                let ch = substate[idx] === true;
                let timerBtn = '';
                if((step.id === 1 && idx === 2) || (step.id === 6 && idx === 1) || (step.id === 10 && idx === 0)) {
                    timerBtn = `<button class="timer-btn" data-timer-start="${step.id}"><i class="fas fa-hourglass-start"></i> Таймер</button>`;
                }
                substepsHtml += `<div class="substep ${ch ? 'checked' : ''}"><input type="checkbox" class="substep-cb" data-step="${step.id}" data-idx="${idx}" ${ch ? 'checked' : ''} ${isLocked || isDone ? 'disabled' : ''}><span>${sub}</span>${timerBtn}</div>`;
            });
            substepsHtml += '</div>';
            let timerHtml = '';
            if(step.timer && (step.id === 1 || step.id === 6 || step.id === 10)) {
                let currentSec = timerState?.seconds ?? step.timer.duration;
                if(!isTimerActive) {
                    timerHtml = `<div class="timer-control"><button class="timer-btn" data-timer-start="${step.id}" ${isLocked || isDone ? 'disabled' : ''}><i class="fas fa-play"></i> Таймер ${step.timer.label}</button></div>`;
                } else {
                    timerHtml = `<div class="timer-control"><div class="timer-active"><span class="timer-time" data-timer-display="${step.id}">${formatTime(currentSec)}</span><button class="timer-icon-btn" data-timer-stop="${step.id}"><i class="fas fa-stop"></i></button></div></div>`;
                }
            }
            html += `<div class="step-card ${isDone ? 'done' : ''} ${isLocked ? 'locked' : ''}" data-step-id="${step.id}"><div class="step-content"><div class="step-header"><div class="step-number">${step.id}</div><div class="step-title">${step.title}</div>${step.timer ? `<div class="step-timer-badge"><i class="far fa-clock"></i> ${step.timer.label}</div>` : ''}</div><div class="step-desc">${step.desc}</div>${substepsHtml}${timerHtml}</div><button class="step-done-btn" data-step-toggle="${step.id}" ${isDone || isLocked ? 'disabled' : ''}>${isDone ? '✓ Готово' : '✓ Отметить выполненным'}</button></div>`;
        });
        container.innerHTML = html;
        document.querySelectorAll('[data-step-toggle]').forEach(btn => btn.addEventListener('click', () => toggleStep(parseInt(btn.dataset.stepToggle))));
        document.querySelectorAll('[data-timer-start]').forEach(btn => btn.addEventListener('click', () => { let sid=parseInt(btn.dataset.timerStart); let s=STEPS.find(s=>s.id===sid); if(s?.timer) startTimer(sid, s.timer.duration); }));
        document.querySelectorAll('[data-timer-stop]').forEach(btn => btn.addEventListener('click', () => stopTimer(parseInt(btn.dataset.timerStop))));
        document.querySelectorAll('.substep-cb').forEach(cb => cb.addEventListener('change', function() { updateSubstep(parseInt(this.dataset.step), parseInt(this.dataset.idx), this.checked); }));
        updateProgress();
    }

    function updateProgress() {
        let percent = Math.round((completedSteps.length / STEPS.length) * 100);
        document.getElementById('progressFill').style.width = `${percent}%`;
        document.getElementById('progressPercent').innerText = `${percent}%`;
        document.getElementById('stepsCounter').innerText = `Выполнено ${completedSteps.length} из ${STEPS.length} шагов`;
        let hide = document.getElementById('hideDoneCheckbox')?.checked;
        document.querySelectorAll('.step-card').forEach(card => {
            let stepId = parseInt(card.dataset.stepId);
            if(hide && completedSteps.includes(stepId)) card.classList.add('hidden');
            else card.classList.remove('hidden');
        });
    }

    function resetAll() {
        if(confirm('🥣 Сбросить весь прогресс?')) {
            for(let id in timerIntervals) clearInterval(timerIntervals[id]);
            completedSteps = []; checkedIngredients = []; substepsState = {}; timersState = {};
            currentActiveTimerId = null; portions = 4;
            document.getElementById('portionsInput').value = portions;
            saveAll();
            renderIngredients(); renderSteps(); updateProgress();
            document.getElementById('floatingTimer').classList.remove('visible');
            showToast('Прогресс сброшен');
        }
    }

    function initTheme() {
        const root = document.documentElement;
        if (isDark) {
            root.style.setProperty('--cream', '#2A2520');
            root.style.setProperty('--cream-dark', '#3A3530');
            root.style.setProperty('--text-dark', '#E8E0D0');
            root.style.setProperty('--text-soft', '#B0AA98');
            root.style.setProperty('--border', '#4A4540');
            document.getElementById('themeBtn').innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            root.style.setProperty('--cream', '#FDF5E8');
            root.style.setProperty('--cream-dark', '#F0E0D0');
            root.style.setProperty('--text-dark', '#3D2A1A');
            root.style.setProperty('--text-soft', '#7A5A3A');
            root.style.setProperty('--border', '#E8D8C0');
            document.getElementById('themeBtn').innerHTML = '<i class="fa-solid fa-moon"></i>';
        }
    }

    async function initWakeLock() {
        let btn = document.getElementById('wakeLockBtn');
        if(!('wakeLock' in navigator)) { btn.style.display='none'; return; }
        btn.addEventListener('click', async () => {
            if(!wakeLock) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    btn.style.background='#7BA05B'; btn.innerHTML='<i class="fas fa-check"></i> Экран активен';
                    btn.style.color='white';
                    wakeLock.addEventListener('release', () => { wakeLock=null; btn.style.background=''; btn.innerHTML='<i class="fas fa-sun"></i> Экран не гаснет'; btn.style.color=''; });
                } catch(e){ showToast('Ошибка активации'); }
            } else { wakeLock.release(); }
        });
    }

    function init() {
        initTheme();
        checkAutoReset();
        renderIngredients(); resumeTimers(); renderSteps(); updateProgress();
        document.getElementById('portMinus').addEventListener('click',()=>updatePortions(-1));
        document.getElementById('portPlus').addEventListener('click',()=>updatePortions(1));
        document.getElementById('portionsInput').addEventListener('change',function(){ let v=parseInt(this.value)||4; v=Math.min(50,Math.max(2,v)); portions=v; this.value=v; renderIngredients(); localStorage.setItem('peasoup_portions', v); showToast(`Порций: ${portions}`); });
        document.getElementById('resetBtn').addEventListener('click',resetAll);
        document.getElementById('hideDoneCheckbox').addEventListener('change',()=>updateProgress());
        document.getElementById('startBtn').addEventListener('click',()=>{ let first=document.querySelector('.step-card:not(.done):not(.locked)'); if(first) first.scrollIntoView({behavior:'smooth'}); });
        document.getElementById('scrollTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
        document.getElementById('floatingTimerStop').addEventListener('click',()=>{ if(currentActiveTimerId) stopTimer(currentActiveTimerId); });
        document.getElementById('themeBtn').addEventListener('click', () => { isDark = !isDark; localStorage.setItem('peasoup_theme', isDark ? 'dark' : 'light'); initTheme(); });
        window.addEventListener('scroll',()=>{ document.getElementById('scrollTop').classList.toggle('visible',window.scrollY>200); });
        initWakeLock();
    }
    init();
})();
</script>
</body>
</html>
