<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Те самые беляши — с хрустом и соком, как в детстве. Рецепт, который всегда показывает, что делать прямо сейчас">
<meta name="theme-color" content="#D93A2B">
<title>🥟 Те самые беляши</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Karla:wght@400;500;600;700;800&family=Martian+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>

<style>
    *{ margin:0; padding:0; box-sizing:border-box; }

    :root{
        --red:#D93A2B;
        --red-dark:#A82A1E;
        --mustard:#F4B740;
        --charcoal:#221D1A;
        --cream:#FFF7E8;
        --surface:#FFFFFF;
        --text:#2A211A;
        --text-soft:#7A6A58;
        --line:rgba(34,29,26,0.14);
        --shadow-sm:0 4px 14px rgba(0,0,0,0.08);
        --shadow-md:0 10px 26px rgba(0,0,0,0.13);
        --shadow-lg:0 22px 46px rgba(0,0,0,0.26);
        --inset-highlight:rgba(255,255,255,0.6);
        --r-card:14px;
        --r-full:999px;
        --ease:cubic-bezier(.22,.9,.32,1);
    }

    [data-theme="dark"]{
        --cream:#1D1815;
        --surface:#27201B;
        --text:#F3E7D6;
        --text-soft:#BAA98F;
        --line:rgba(244,183,64,0.22);
        --shadow-sm:0 4px 14px rgba(0,0,0,0.32);
        --shadow-md:0 10px 26px rgba(0,0,0,0.38);
        --shadow-lg:0 22px 46px rgba(0,0,0,0.5);
        --inset-highlight:rgba(255,255,255,0.05);
    }

    @media (prefers-reduced-motion: reduce){
        *,*::before,*::after{
            animation-duration:0.01ms !important;
            animation-iteration-count:1 !important;
            transition-duration:0.01ms !important;
            scroll-behavior:auto !important;
        }
    }

    html{ scroll-behavior:smooth; }
    body{
        background:var(--cream);
        font-family:'Karla',sans-serif;
        color:var(--text);
        min-height:100vh;
        transition:background .3s var(--ease), color .3s var(--ease);
        -webkit-font-smoothing:antialiased;
    }
    ::selection{ background:var(--mustard); color:var(--charcoal); }
    :focus-visible{ outline:3px solid var(--red); outline-offset:2px; }

    .app{ max-width:800px; margin:0 auto; padding:18px 18px 110px; }
    @media (min-width:768px){ .app{ padding:40px 30px 130px; } }

    /* ===== HEADER ===== */
    .header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding:11px 22px; background:var(--charcoal); border-radius:var(--r-card); box-shadow:var(--shadow-sm); }
    .logo{ display:flex; align-items:center; gap:11px; }
    .logo-icon{ font-size:30px; display:inline-block; animation:iconWiggle 3s ease-in-out infinite; }
    @keyframes iconWiggle{ 0%,100%{ transform:rotate(-8deg); } 50%{ transform:rotate(8deg); } }
    .logo-text{ font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; color:var(--cream); text-transform:uppercase; letter-spacing:.02em; }
    .logo-text span{ color:var(--mustard); }
    .theme-btn{ background:transparent; border:1.5px solid var(--mustard); border-radius:50%; width:38px; height:38px; color:var(--mustard); cursor:pointer; transition:.2s var(--ease); display:flex; align-items:center; justify-content:center; }
    .theme-btn:hover{ background:var(--mustard); color:var(--charcoal); }

    /* ===== PHOTO GALLERY ===== */
    .photo-card{ background:var(--surface); border-radius:var(--r-card); padding:20px 22px; margin-bottom:18px; box-shadow:var(--shadow-sm), inset 0 1px 0 var(--inset-highlight); border-left:5px solid var(--red); }
    .photo-strip{ display:flex; gap:10px; flex-wrap:wrap; }
    .photo-thumb{ width:82px; height:82px; border-radius:8px; background-size:cover; background-position:center; position:relative; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .25s var(--ease); flex-shrink:0; animation:photoIn .3s var(--ease); }
    @keyframes photoIn{ from{ opacity:0; transform:scale(.8); } to{ opacity:1; transform:scale(1); } }
    .photo-thumb:hover{ transform:scale(1.05); }
    .photo-thumb:active{ transform:scale(.95); }
    .photo-delete{ position:absolute; top:-7px; right:-7px; width:23px; height:23px; border-radius:50%; background:var(--red); color:#fff; border:2px solid var(--surface); display:flex; align-items:center; justify-content:center; font-size:10.5px; cursor:pointer; }
    .photo-add{ width:82px; height:82px; border-radius:8px; border:2px dashed var(--line); background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text-soft); cursor:pointer; font-size:10.5px; font-weight:700; text-align:center; transition:.2s var(--ease); flex-shrink:0; }
    .photo-add:hover{ border-color:var(--red); color:var(--red); }
    .photo-add:active{ transform:scale(.95); }
    .photo-add i{ font-size:17px; }
    .photo-empty-hint{ display:none; align-items:center; gap:10px; color:var(--text-soft); font-size:12.5px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
    .photo-empty-hint i{ font-size:19px; opacity:.4; }

    .lightbox{ position:fixed; inset:0; background:rgba(20,16,12,.9); z-index:3000; display:flex; align-items:center; justify-content:center; padding:24px; animation:fadeIn .2s var(--ease); }
    @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
    .lightbox img{ max-width:100%; max-height:100%; border-radius:12px; box-shadow:var(--shadow-lg); }
    .lightbox-close{ position:absolute; top:20px; right:20px; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.15); border:none; color:#fff; font-size:16px; cursor:pointer; }

    /* ===== HERO ===== */
    .hero{ text-align:center; margin-bottom:18px; background:var(--surface); border-radius:var(--r-card); padding:30px 20px; box-shadow:var(--shadow-sm), inset 0 1px 0 var(--inset-highlight); border-top:5px solid var(--red); border-bottom:5px solid var(--mustard); animation:rise .55s var(--ease) both; }
    @keyframes rise{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
    .hero h1{ font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:52px; color:var(--red); letter-spacing:.02em; line-height:.95; }
    @media (min-width:600px){ .hero h1{ font-size:66px; } }
    .hero p{ color:var(--text-soft); margin-top:8px; font-size:14px; font-style:italic; }
    .hero-badge{ display:inline-block; background:var(--charcoal); color:var(--mustard); padding:6px 18px; border-radius:var(--r-full); font-size:12.5px; margin-top:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }

    .status-line{ margin-top:16px; display:inline-flex; align-items:center; gap:10px; background:var(--cream); padding:9px 18px; border-radius:var(--r-full); font-size:13.5px; font-weight:700; color:var(--red-dark); }
    .status-line .dot{ width:8px; height:8px; border-radius:50%; background:var(--mustard); flex-shrink:0; opacity:.5; }
    .status-line .dot.active{ opacity:1; background:var(--red); animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(217,58,43,0.35);} 50%{ box-shadow:0 0 0 6px rgba(217,58,43,0);} }

    .action-row{ display:flex; gap:10px; margin-bottom:20px; }
    .start-btn{ flex:1; background:var(--red); border:none; border-radius:var(--r-card); padding:16px 20px; color:#fff; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 14px 28px -12px rgba(168,42,30,0.5); transition:transform .2s var(--ease), background .2s; display:flex; align-items:center; justify-content:center; gap:9px; text-transform:uppercase; letter-spacing:.02em; font-family:'Oswald',sans-serif; }
    .start-btn:hover{ background:var(--red-dark); transform:translateY(-2px); }
    .start-btn:active{ transform:scale(.97); }
    .chef-btn{ background:var(--charcoal); border:none; border-radius:var(--r-card); padding:16px 18px; color:var(--mustard); font-weight:700; font-size:15px; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .2s var(--ease); }
    .chef-btn:hover{ transform:translateY(-2px); }
    .chef-btn:active{ transform:scale(.97); }

    /* ===== PROGRESS DOTS ===== */
    .dots-card{ background:var(--surface); border-radius:var(--r-card); padding:16px 20px; margin-bottom:18px; box-shadow:var(--shadow-sm); }
    .dots-row{ display:flex; flex-wrap:wrap; gap:7px; }
    .step-dot{ width:14px; height:14px; border-radius:3px; background:rgba(34,29,26,0.14); border:none; padding:0; cursor:pointer; transition:transform .2s var(--ease), background .2s var(--ease); }
    .step-dot:hover{ transform:scale(1.3); }
    .step-dot.done{ background:var(--mustard); animation:dotPop .35s var(--ease); }
    @keyframes dotPop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.6); } 100%{ transform:scale(1); } }
    .step-dot.current{ background:var(--red); transform:scale(1.3); }
    .dots-label{ margin-top:9px; font-size:12.5px; color:var(--text-soft); }

    /* ===== CARDS COMMON ===== */
    .card{ background:var(--surface); border-radius:var(--r-card); padding:22px; margin-bottom:18px; box-shadow:var(--shadow-sm), inset 0 1px 0 var(--inset-highlight); transition:transform .25s var(--ease); }
    .card:hover{ transform:translateY(-2px); }
    .card-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:16px; }
    .card-header h2{ font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; color:var(--charcoal); text-transform:uppercase; letter-spacing:.01em; }

    .portion-control{ display:flex; align-items:center; gap:9px; background:var(--cream); padding:5px 15px; border-radius:var(--r-full); }
    .portion-control button{ background:var(--red); border:none; width:30px; height:30px; border-radius:50%; color:#fff; font-weight:700; cursor:pointer; transition:transform .15s var(--ease); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 3px 6px rgba(168,42,30,.3); }
    .portion-control button:hover{ transform:scale(1.08); }
    .portion-control button:active{ transform:scale(.92); }
    .portion-input{ width:36px; text-align:center; border:none; background:transparent; font-weight:800; font-size:15px; color:var(--text); font-family:'Martian Mono',monospace; outline:none; }
    .portion-control span{ font-size:12px; color:var(--text-soft); font-weight:600; }

    .ing-category{ font-weight:700; color:var(--red); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:16px 0 8px; }
    .ing-category:first-child{ margin-top:0; }
    .ingredient-item{ background:var(--cream); border-radius:8px; padding:11px 15px; display:flex; align-items:center; gap:12px; margin-bottom:7px; cursor:pointer; transition:opacity .2s var(--ease), transform .2s var(--ease); }
    .ingredient-item:hover{ transform:translateX(3px); }
    .ingredient-item:active{ transform:scale(.98); }
    .ingredient-item input{ width:19px; height:19px; cursor:pointer; accent-color:var(--red); flex-shrink:0; }
    .ingredient-item input:checked{ animation:checkPop .3s var(--ease); }
    @keyframes checkPop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
    .ingredient-name{ flex:1; font-weight:600; font-size:14px; }
    .ingredient-amount{ background:var(--surface); padding:4px 12px; border-radius:var(--r-full); font-size:12px; font-weight:700; color:var(--red-dark); font-family:'Martian Mono',monospace; border:1px solid var(--line); }
    .ingredient-item.checked{ opacity:.55; }
    .ingredient-item.checked .ingredient-name{ text-decoration:line-through; }

    .wake-btn{ width:100%; background:var(--cream); border:1.5px solid var(--line); color:var(--charcoal); padding:12px; border-radius:var(--r-full); margin-top:16px; font-weight:700; font-size:13px; cursor:pointer; transition:background .2s; }
    .wake-btn:hover{ background:var(--line); }
    .wake-btn.active{ background:var(--mustard); border-color:var(--mustard); color:var(--charcoal); }

    .control-panel{ display:flex; justify-content:space-between; align-items:center; background:var(--surface); padding:11px 20px; border-radius:var(--r-full); margin-bottom:20px; box-shadow:var(--shadow-sm); }
    .reset-btn, .share-btn{ background:none; border:none; color:var(--text-soft); font-weight:700; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:7px; }
    .reset-btn:hover{ color:var(--red); }
    .share-btn:hover{ color:var(--charcoal); }

    /* ===== STEPS ===== */
    .step-group-title{ font-family:'Oswald',sans-serif; font-weight:600; font-size:21px; color:var(--charcoal); text-transform:uppercase; letter-spacing:.01em; margin:34px 0 14px; padding-bottom:5px; border-bottom:3px solid var(--red); display:inline-block; }
    .step-group-title:first-of-type{ margin-top:0; }

    .step-card{ background:var(--surface); border-radius:var(--r-card); margin-bottom:12px; border:2px solid transparent; position:relative; transition:border-color .3s var(--ease), opacity .3s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease); box-shadow:var(--shadow-sm), inset 0 1px 0 var(--inset-highlight); }
    .step-card.enter{ animation:cardIn .5s var(--ease) both; }
    @keyframes cardIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
    .step-card.current{ border-color:var(--red); box-shadow:var(--shadow-md); }
    .step-card:not(.locked):not(.done):hover{ transform:translateY(-3px); }
    .step-card.done{ opacity:.6; border-color:var(--mustard); }
    .step-card.locked{ opacity:.5; }
    .step-card.locked::after{ content:"\f023"; font-family:"Font Awesome 6 Free"; font-weight:900; position:absolute; top:18px; right:18px; font-size:14px; color:var(--text-soft); opacity:.6; }
    .step-content{ padding:20px; }
    .step-header{ display:flex; align-items:center; gap:13px; margin-bottom:11px; flex-wrap:wrap; }
    .step-number{ width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Martian Mono',monospace; font-weight:700; font-size:15px; color:#fff; background:linear-gradient(145deg, var(--red), var(--red-dark)); flex-shrink:0; box-shadow:inset 0 2px 3px rgba(255,255,255,.3), 0 4px 10px rgba(168,42,30,.35); }
    .step-card.current .step-number{ animation:numberGlow 2s ease-in-out infinite; }
    @keyframes numberGlow{ 0%,100%{ box-shadow:inset 0 2px 3px rgba(255,255,255,.3), 0 4px 10px rgba(168,42,30,.35), 0 0 0 0 rgba(217,58,43,.4); } 50%{ box-shadow:inset 0 2px 3px rgba(255,255,255,.3), 0 4px 10px rgba(168,42,30,.35), 0 0 0 7px rgba(217,58,43,0); } }
    .step-title{ font-weight:700; font-size:16px; font-family:'Oswald',sans-serif; }
    .step-timer-badge{ background:var(--cream); border-radius:var(--r-full); padding:5px 13px; font-size:11.5px; color:var(--red-dark); font-weight:600; }
    .current-tag{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; background:var(--red); color:#fff; padding:4px 10px; border-radius:var(--r-full); }
    .step-desc{ color:var(--text-soft); margin-bottom:14px; padding-left:51px; font-size:13.5px; line-height:1.5; }

    .substeps{ padding-left:51px; margin-bottom:12px; display:flex; flex-direction:column; gap:2px; }
    .substep{ display:grid; grid-template-columns:16px 1fr; align-items:start; gap:10px; padding:7px 0; cursor:pointer; }
    .substep input{ width:16px; height:16px; cursor:pointer; accent-color:var(--red); margin-top:2px; }
    .substep input:checked{ animation:checkPop .3s var(--ease); }
    .substep.checked span{ text-decoration:line-through; opacity:.55; }
    .substep span{ font-size:13.5px; line-height:1.4; }

    .timer-control{ padding-left:51px; margin:12px 0 4px; display:flex; gap:8px; flex-wrap:wrap; }
    .timer-btn{ background:var(--red); border:none; padding:10px 20px; border-radius:var(--r-full); font-weight:700; font-size:13px; color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:transform .15s var(--ease); box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 4px 10px rgba(168,42,30,.3); }
    .timer-btn:active{ transform:scale(.96); }
    .timer-skip-btn{ background:transparent; border:1.5px solid var(--line); padding:9px 16px; border-radius:var(--r-full); font-weight:600; font-size:12px; color:var(--text-soft); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .timer-skip-btn:hover{ border-color:var(--mustard); color:var(--charcoal); }

    /* signature element: беляш шипит на сковороде — расходящиеся волны жара */
    .sizzle-wrap{ display:inline-flex; align-items:center; gap:14px; background:var(--cream); padding:8px 16px 8px 10px; border-radius:var(--r-full); }
    .sizzle-pan{ width:36px; height:36px; border-radius:50%; border:2.5px solid var(--charcoal); position:relative; background:var(--mustard); flex-shrink:0; overflow:visible; }
    .sizzle-wave{ position:absolute; inset:-4px; border:2px solid var(--red); border-radius:50%; opacity:0; animation:sizzleOut 1.6s ease-out infinite; }
    @keyframes sizzleOut{ 0%{ transform:scale(.7); opacity:.7; } 100%{ transform:scale(1.5); opacity:0; } }
    .timer-time{ font-family:'Martian Mono',monospace; font-size:14px; font-weight:700; color:var(--red-dark); }
    .timer-progress-track{ width:66px; height:4px; background:rgba(34,29,26,0.14); border-radius:var(--r-full); margin-top:3px; }
    .timer-progress-fill{ height:100%; background:var(--red); width:0%; border-radius:var(--r-full); transition:width 1s linear; }
    .timer-icon-btn{ background:var(--surface); border:none; width:34px; height:34px; border-radius:50%; cursor:pointer; color:var(--red-dark); }

    .step-done-btn{ width:calc(100% - 40px); margin:0 20px 20px; background:transparent; border:2px solid var(--red); border-radius:var(--r-full); padding:11px; font-weight:700; font-size:13.5px; cursor:pointer; color:var(--red); transition:background .2s, color .2s, transform .15s; text-transform:uppercase; letter-spacing:.02em; font-family:'Oswald',sans-serif; }
    .step-done-btn:hover:not(:disabled){ background:var(--red); color:#fff; }
    .step-done-btn:active:not(:disabled){ transform:scale(.98); }
    .step-done-btn:disabled{ opacity:.5; cursor:not-allowed; }
    .step-card.done .step-done-btn{ background:var(--mustard); border-color:var(--mustard); color:var(--charcoal); opacity:1; }

    /* ===== CHEF MODE (сохранённая полезная фишка — полноэкранная навигация) ===== */
    body.chef-mode .card, body.chef-mode .dots-card, body.chef-mode .hero, body.chef-mode .action-row, body.chef-mode .control-panel, body.chef-mode .step-group-title, body.chef-mode .step-card:not(.chef-active){ display:none !important; }
    body.chef-mode .step-card.chef-active{ box-shadow:var(--shadow-lg); border-color:var(--red); border-width:3px; }
    .chef-nav{ position:fixed; bottom:20px; left:16px; right:16px; z-index:400; background:var(--charcoal); border-radius:var(--r-full); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:var(--shadow-lg); max-width:420px; margin:0 auto; }
    .chef-nav button{ background:var(--red); border:none; border-radius:var(--r-full); padding:10px 16px; color:#fff; font-weight:700; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px; }
    .chef-nav button:disabled{ opacity:.35; cursor:not-allowed; }
    .chef-counter{ color:var(--mustard); font-weight:700; font-size:12.5px; }

    /* ===== FLOATING PILL ===== */
    .float-pill{ position:fixed; left:16px; right:16px; bottom:20px; z-index:200; background:var(--charcoal); color:#fff; border-radius:var(--r-full); padding:12px 12px 12px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; box-shadow:var(--shadow-lg); transform:translateY(140%); transition:transform .4s var(--ease); max-width:420px; margin:0 auto; cursor:pointer; }
    .float-pill.visible{ transform:translateY(0); }
    .float-pill .fp-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,0.6); font-weight:700; }
    .float-pill .fp-main{ font-size:13.5px; font-weight:700; }
    .float-pill .fp-time{ font-family:'Martian Mono',monospace; font-size:19px; font-weight:800; color:var(--mustard); }
    .fp-stop{ background:rgba(255,255,255,0.14); border:none; width:36px; height:36px; border-radius:50%; color:#fff; cursor:pointer; flex-shrink:0; }

    .scroll-top{ position:fixed; bottom:86px; right:16px; width:44px; height:44px; background:var(--surface); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; visibility:hidden; transition:.25s; box-shadow:var(--shadow-md); color:var(--red); }
    .scroll-top.visible{ opacity:1; visibility:visible; }

    .toast{ position:fixed; bottom:100px; left:20px; right:20px; background:var(--charcoal); color:var(--cream); padding:12px 20px; border-radius:var(--r-full); text-align:center; z-index:300; font-weight:600; font-size:13.5px; transform:translateY(100px); opacity:0; transition:.35s var(--ease); max-width:420px; margin:0 auto; }
    .toast.show{ transform:translateY(0); opacity:1; }

    .footer{ text-align:center; margin:48px 0 10px; font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:28px; color:var(--red); opacity:.85; }

    .completion-modal{ position:fixed; inset:0; background:rgba(20,16,12,0.75); backdrop-filter:blur(8px); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px; }
    .completion-card{ background:var(--surface); border-radius:var(--r-card); padding:38px 32px; text-align:center; max-width:340px; animation:cardIn .4s var(--ease); border-top:5px solid var(--mustard); }
    .completion-card .emoji{ font-size:50px; margin-bottom:14px; }
    .completion-card h3{ font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--red); margin-bottom:8px; }
    .completion-card p{ color:var(--text-soft); font-size:13.5px; margin-bottom:20px; line-height:1.5; }
    .completion-btn{ background:var(--red); border:none; padding:12px 28px; border-radius:var(--r-full); color:#fff; font-weight:700; cursor:pointer; width:100%; text-transform:uppercase; letter-spacing:.02em; font-family:'Oswald',sans-serif; }
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo"><span class="logo-icon">🥟</span><span class="logo-text">Те самые <span>беляши</span></span></div>
        <button class="theme-btn" id="themeBtn" aria-label="Переключить тёмную тему"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div class="card photo-card">
        <div class="card-header">
            <h2><i class="fas fa-camera"></i> Фото</h2>
        </div>
        <div class="photo-strip" id="photoStrip"></div>
        <div class="photo-empty-hint" id="photoEmptyHint">
            <i class="fas fa-image"></i>
            <span>Добавьте свои фото готового блюда — они появятся здесь</span>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </div>

    <div class="hero">
        <h1>Те самые беляши</h1>
        <p>🥟 с хрустом и соком, как в детстве</p>
        <div class="hero-badge"><i class="fas fa-heart"></i> Домашний рецепт</div>
        <div class="status-line" id="statusLine"><span class="dot active" id="statusDot"></span><span id="statusText">Готовим первый шаг</span></div>
    </div>

    <div class="action-row">
        <button class="start-btn" id="startBtn"><i class="fas fa-arrow-down"></i> К текущему шагу</button>
        <button class="chef-btn" id="chefModeBtn" aria-label="Режим шеф-повара — по одному шагу на экран"><i class="fas fa-utensils"></i></button>
    </div>

    <div class="dots-card">
        <div class="dots-row" id="dotsRow"></div>
        <div class="dots-label" id="dotsLabel">Выполнено 0 из 8 шагов</div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-basket-shopping"></i> Ингредиенты</h2>
            <div class="portion-control">
                <button id="portMinus" aria-label="Уменьшить количество порций">−</button>
                <input type="text" id="portionsInput" value="2" class="portion-input" inputmode="numeric" pattern="[0-9]*" aria-label="Количество порций">
                <button id="portPlus" aria-label="Увеличить количество порций">+</button>
                <span>порц.</span>
            </div>
        </div>
        <div id="ingredientsContainer"></div>
        <button class="wake-btn" id="wakeLockBtn"><i class="fas fa-sun"></i> Экран не гаснет</button>
    </div>

    <div class="control-panel">
        <button class="reset-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Сбросить прогресс</button>
        <button class="share-btn" id="shareBtn" style="display:none;"><i class="fas fa-share-alt"></i> Поделиться</button>
    </div>

    <div id="stepsContainer"></div>
    <div class="footer">🥟 Вкуснотища!</div>
</div>

<div class="float-pill" id="floatPill">
    <div><div class="fp-label" id="fpLabel">Далее</div><div class="fp-main" id="fpMain">Шаг 1</div></div>
    <div style="display:flex; align-items:center; gap:12px;">
        <span class="fp-time" id="fpTime" style="display:none;">00:00</span>
        <button class="fp-stop" id="fpStop" style="display:none;" aria-label="Остановить таймер"><i class="fas fa-stop"></i></button>
        <i class="fas fa-arrow-right" id="fpArrow" style="opacity:.6;"></i>
    </div>
</div>

<div class="scroll-top" id="scrollTop" role="button" tabindex="0" aria-label="Наверх страницы"><i class="fas fa-arrow-up"></i></div>
<div id="toast" class="toast"></div>
<audio id="alarmAudio" preload="auto"><source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg"></audio>

<script>
(function(){
    "use strict";

    const AUTO_RESET_SECONDS = 12 * 3600;
    const MIN_PORTIONS = 1;
    const MAX_PORTIONS = 50;
    const PORTIONS_JOKE_THRESHOLD = 8;

    /* ============================================ */
    /* === ИНГРЕДИЕНТЫ =============================== */
    /* ============================================ */

    const INGREDIENTS_BASE = {
        basePortions:2,
        items:[
            { id:'water_boil', name:'Кипяток (заварка)', baseAmount:480, unit:'мл', category:'🍞 Тесто' },
            { id:'flour_scald', name:'Мука для заварки', baseAmount:65, unit:'г', category:'🍞 Тесто' },
            { id:'water_warm', name:'Тёплая вода', baseAmount:480, unit:'мл', category:'🍞 Тесто' },
            { id:'yeast', name:'Дрожжи (сухие)', baseAmount:12, unit:'г', category:'🍞 Тесто' },
            { id:'sugar', name:'Сахар', baseAmount:5, unit:'г', category:'🍞 Тесто' },
            { id:'salt', name:'Соль', baseAmount:6, unit:'г', category:'🍞 Тесто' },
            { id:'flour_main', name:'Мука основная', baseAmount:1000, unit:'г', category:'🍞 Тесто' },
            { id:'oil_dough', name:'Масло растит. в тесто', baseAmount:30, unit:'мл', category:'🍞 Тесто' },
            { id:'meat', name:'Фарш (свинина+говядина)', baseAmount:700, unit:'г', category:'🥩 Начинка' },
            { id:'onion', name:'Лук репчатый', baseAmount:240, unit:'г', category:'🥩 Начинка' },
            { id:'water_filling', name:'Вода для сочности', baseAmount:120, unit:'мл', category:'🥩 Начинка' },
            { id:'salt_pepper', name:'Соль, перец', baseAmount:1, unit:'по вкусу', category:'🥩 Начинка' },
            { id:'fry_oil', name:'Масло для жарки', baseAmount:300, unit:'мл', category:'🔥 Жарка' }
        ]
    };

    const STEPS = [
        { id:1, group:'🍞 Заварное тесто', title:'Завариваем муку', desc:'Смешайте кипяток с мукой до однородности, остудите', substeps:['Вскипятить 480 мл воды','Влить кипяток в 65 г муки','Интенсивно перемешать','Остудить до 35-40°C'], timer:null, requires:[] },
        { id:2, group:'🍞 Заварное тесто', title:'Опара оживает', desc:'Разведите дрожжи, сахар, соль, добавьте заварку и часть муки. Дайте подняться', substeps:['Размешать дрожжи с сахаром','Добавить заварку и 65 г муки','Оставить в тепле'], timer:{duration:900, label:'15 мин'}, requires:[1] },
        { id:3, group:'🍞 Заварное тесто', title:'Месим до гладкости', desc:'Добавьте масло и остальную муку, вымешивайте до гладкости', substeps:['Влить масло','Вмешивать муку','Вымешивать 8-10 минут'], timer:null, requires:[2] },
        { id:4, group:'🍞 Заварное тесто', title:'Тесто отдыхает', desc:'Накройте и уберите в тепло на 1 час', substeps:['Смазать миску','Накрыть плёнкой','Убрать в тепло'], timer:{duration:3600, label:'1 час'}, requires:[3] },
        { id:5, group:'🥩 Начинка', title:'Сочная начинка', desc:'Смешайте фарш, лук, соль, перец, воду', substeps:['Прокрутить лук','Соединить с фаршем','Добавить специи','Влить 120 мл воды'], timer:null, requires:[4] },
        { id:6, group:'🥟 Лепка', title:'Лепка с дырочкой', desc:'Сделайте лепёшки, выложите фарш, защипайте с дырочкой', substeps:['Разделить тесто','Расплющить','Выложить фарш','Защипать'], timer:null, requires:[4,5] },
        { id:7, group:'🔥 Жарка', title:'Жарим до золота', desc:'Разогрейте масло. Жарьте с двух сторон до румяной корочки', substeps:['Разогреть масло','Выложить отверстием вниз','Жарить 3-4 минуты','Перевернуть и жарить'], timer:{duration:720, label:'~12 мин'}, requires:[6] },
        { id:8, group:'🍽️ Подача', title:'Горячими на стол', desc:'Выложите на салфетку, чтобы убрать лишний жир', substeps:['Промокнуть масло','Выложить на блюдо','Подавать горячими'], timer:null, requires:[7] }
    ];

    /* ============================================ */
    /* === СОСТОЯНИЕ ================================ */
    /* ============================================ */

    let checkedIngredients = JSON.parse(localStorage.getItem('bel_ingredients') || '[]');
    let completedSteps = JSON.parse(localStorage.getItem('bel_steps') || '[]');
    let substepsState = JSON.parse(localStorage.getItem('bel_substeps') || '{}');
    let timersState = JSON.parse(localStorage.getItem('bel_timers') || '{}');
    let portions = clampPortions(parseInt(localStorage.getItem('bel_portions')) || INGREDIENTS_BASE.basePortions);
    let currentActiveTimerId = null;
    let wakeLock = null;
    let lastActivity = localStorage.getItem('bel_last_activity');
    let isDark = localStorage.getItem('bel_theme') === 'dark';
    let photos = JSON.parse(localStorage.getItem('bel_photos') || '[]');
    let firstStepsRender = true;
    let isChefMode = false;
    let chefIndex = 0;

    function clampPortions(v){ return Math.min(MAX_PORTIONS, Math.max(MIN_PORTIONS, isNaN(v)?INGREDIENTS_BASE.basePortions:v)); }

    /** Переводит крупные значения в удобные единицы: 1000 г -> 1 кг, 1500 мл -> 1.5 л. */
    function formatAmount(amount, unit){
        if((unit==='г' || unit==='мл') && amount>=1000){
            let converted = Math.round((amount/1000)*10)/10;
            return { amount:converted, unit: unit==='г'?'кг':'л' };
        }
        return { amount: Number.isInteger(amount)?amount:Math.round(amount*10)/10, unit };
    }

    /* ============================================ */
    /* === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =================== */
    /* ============================================ */

    function isStepAvailable(step){
        if (completedSteps.includes(step.id)) return false;
        if (!step.requires || step.requires.length === 0) return true;
        return step.requires.every(reqId => completedSteps.includes(reqId));
    }

    function getCurrentStep(){
        return STEPS.find(s => !completedSteps.includes(s.id) && isStepAvailable(s));
    }

    function saveAll(){
        try{
            localStorage.setItem('bel_ingredients', JSON.stringify(checkedIngredients));
            localStorage.setItem('bel_steps', JSON.stringify(completedSteps));
            localStorage.setItem('bel_timers', JSON.stringify(timersState));
            localStorage.setItem('bel_substeps', JSON.stringify(substepsState));
            localStorage.setItem('bel_last_activity', Date.now().toString());
            localStorage.setItem('bel_portions', portions);
        }catch(e){ console.error('Ошибка сохранения в localStorage:', e); }
    }

    function showToast(msg, duration){
        let t = document.getElementById('toast');
        if(!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(()=>t.classList.remove('show'), duration || 2200);
    }

    function maybeJokeAboutPortions(newValue, oldValue){
        if(newValue > PORTIONS_JOKE_THRESHOLD && oldValue <= PORTIONS_JOKE_THRESHOLD){
            showToast(`🥟 Ого, ${newValue} порций! Зачем тебе столько? 😄`, 3200);
        }
    }

    function playSound(){
        let audio = document.getElementById('alarmAudio');
        if(audio) audio.play().catch(()=>{ if(navigator.vibrate) navigator.vibrate(200); });
    }

    function formatTime(sec){ let m=Math.floor(sec/60), s=sec%60; return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }

    function checkAutoReset(){
        if(lastActivity){
            let diff = (Date.now() - parseInt(lastActivity)) / 1000;
            if(diff >= AUTO_RESET_SECONDS){
                completedSteps=[]; checkedIngredients=[]; substepsState={}; timersState={};
                currentActiveTimerId=null; portions=INGREDIENTS_BASE.basePortions;
                document.getElementById('portionsInput').value = portions;
                saveAll();
                showToast('✨ Новый день — прогресс обновлён');
                return true;
            }
        }
        return false;
    }

    /* ============================================ */
    /* === СТАТУС-СТРОКА И ТОЧКИ ===================== */
    /* ============================================ */

    function updateStatusAndDots(){
        let statusText = document.getElementById('statusText');
        let statusDot = document.getElementById('statusDot');
        let cur = getCurrentStep();

        if(completedSteps.length === STEPS.length){
            statusText.textContent = 'Беляши готовы — вкуснотища!';
            statusDot.classList.remove('active');
        } else if(cur){
            statusText.textContent = `Шаг ${cur.id} из ${STEPS.length}: ${cur.title}`;
            statusDot.classList.add('active');
        } else {
            let locked = STEPS.find(s=>!completedSteps.includes(s.id));
            statusText.textContent = locked ? `Ждём: шаг ${locked.id} пока недоступен` : 'Всё готово!';
            statusDot.classList.remove('active');
        }

        let dotsRow = document.getElementById('dotsRow');
        dotsRow.innerHTML = STEPS.map(s=>{
            let cls = completedSteps.includes(s.id) ? 'done' : (cur?.id===s.id ? 'current' : '');
            return `<button class="step-dot ${cls}" data-jump="${s.id}" aria-label="Шаг ${s.id}: ${s.title}"></button>`;
        }).join('');
        dotsRow.querySelectorAll('[data-jump]').forEach(btn=>{
            btn.addEventListener('click', ()=>{
                document.querySelector(`.step-card[data-step-id="${btn.dataset.jump}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
            });
        });
        document.getElementById('dotsLabel').textContent = `Выполнено ${completedSteps.length} из ${STEPS.length} шагов`;
    }

    /* ============================================ */
    /* === ПЛАВАЮЩАЯ ПОДСКАЗКА "ЧТО ДАЛЬШЕ" =========== */
    /* ============================================ */

    function updateFloatPill(){
        let pill = document.getElementById('floatPill');
        let label = document.getElementById('fpLabel');
        let main = document.getElementById('fpMain');
        let time = document.getElementById('fpTime');
        let stop = document.getElementById('fpStop');
        let arrow = document.getElementById('fpArrow');

        if(currentActiveTimerId && timersState[currentActiveTimerId]?.status==='running'){
            let state = timersState[currentActiveTimerId];
            label.textContent = 'Идёт таймер';
            main.textContent = 'Осталось времени';
            time.textContent = formatTime(state.seconds);
            time.style.display='inline';
            stop.style.display='flex';
            arrow.style.display='none';
            pill.classList.add('visible');
            pill.onclick = null;
        } else {
            let cur = getCurrentStep();
            if(cur && completedSteps.length < STEPS.length){
                label.textContent = 'Далее';
                main.textContent = `Шаг ${cur.id} · ${cur.title}`;
                time.style.display='none';
                stop.style.display='none';
                arrow.style.display='inline';
                pill.classList.add('visible');
                pill.onclick = ()=> document.querySelector(`.step-card[data-step-id="${cur.id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'});
            } else {
                pill.classList.remove('visible');
                pill.onclick = null;
            }
        }
    }

    /* ============================================ */
    /* === ЗАВЕРШЕНИЕ =============================== */
    /* ============================================ */

    function celebrate(){
        if(typeof confetti === 'function'){
            confetti({particleCount:250, spread:110, origin:{y:0.6}, colors:['#D93A2B','#F4B740','#221D1A']});
        }
        let modal = document.createElement('div');
        modal.className = 'completion-modal';
        modal.innerHTML = `<div class="completion-card"><div class="emoji">🥟🎉</div><h3>Ты — бог беляшей!</h3><p>Горячими на стол — лови комплименты и сметану.</p><button class="completion-btn" onclick="this.closest('.completion-modal').remove()">Вкуснотища!</button></div>`;
        document.body.appendChild(modal);
        setTimeout(()=>modal.remove(), 5000);
        document.getElementById('shareBtn').style.display = 'flex';
    }

    /* ============================================ */
    /* === ПОДШАГИ И ОТМЕТКА ========================= */
    /* ============================================ */

    function allSubstepsDone(stepId){
        let step = STEPS.find(s=>s.id===stepId);
        if(!step || !step.substeps) return true;
        let substate = substepsState[stepId] || {};
        return step.substeps.every((_,idx)=>substate[idx]===true);
    }

    function updateSubstep(stepId, idx, checked){
        if(!substepsState[stepId]) substepsState[stepId]={};
        substepsState[stepId][idx]=checked;
        saveAll();

        let allDone = allSubstepsDone(stepId);
        let timerState = timersState[stepId];
        let timerFinished = !STEPS.find(s=>s.id===stepId)?.timer || (timerState && timerState.seconds===0);

        if(allDone && timerFinished && !completedSteps.includes(stepId)){
            completedSteps.push(stepId);
            saveAll();
            showToast(`✓ Шаг ${stepId} выполнен!`);
            if(completedSteps.length === STEPS.length) celebrate();
        }
        renderSteps();
    }

    function toggleStep(stepId){
        if(completedSteps.includes(stepId)){
            completedSteps = completedSteps.filter(id=>id!==stepId);
            saveAll();
            renderSteps();
            showToast(`Шаг ${stepId} отменён`);
            return;
        }
        if(!allSubstepsDone(stepId)){
            showToast(`⚠️ Отметьте все подпункты`);
            return;
        }
        let step = STEPS.find(s=>s.id===stepId);
        let timerState = timersState[stepId];
        if(step?.timer && timerState && timerState.seconds > 0 && timerState.status!=='stopped'){
            showToast(`⏳ Дождитесь окончания таймера (${formatTime(timersState[stepId].seconds)})`);
            return;
        }
        completedSteps.push(stepId);
        saveAll();
        renderSteps();
        showToast(`✓ Шаг ${stepId} готов!`);
        if(completedSteps.length === STEPS.length) celebrate();
    }

    /* ============================================ */
    /* === ТАЙМЕР ==================================== */
    /* ============================================ */

    function startTimer(stepId, totalSec){
        if(timersState[stepId] && timersState[stepId].status==='running') return;
        timersState[stepId] = { status:'running', seconds:totalSec, total:totalSec, timestamp:Date.now() };
        saveAll();
        currentActiveTimerId = stepId;
        updateFloatPill();
        showToast(`⏲️ Время пошло! Можешь отойти`);
        runTimerTick(stepId);
        renderSteps();
    }

    function runTimerTick(stepId){
        let lastUpdate = Date.now();
        function tick(){
            if(document.hidden){ requestAnimationFrame(tick); return; }
            let cur = timersState[stepId];
            if(!cur || cur.status !== 'running') return;

            let now = Date.now();
            let delta = Math.floor((now - lastUpdate)/1000);
            if(delta > 0){
                cur.seconds = Math.max(0, cur.seconds - delta);
                cur.timestamp = now;
                lastUpdate = now;
                saveAll();

                if(cur.seconds <= 0){
                    cur.status = 'stopped';
                    cur.seconds = 0;
                    saveAll();
                    playSound();
                    showToast(`🔔 Таймер завершён! Беляши ждут`);
                    if(currentActiveTimerId === stepId) currentActiveTimerId = null;

                    if(allSubstepsDone(stepId) && !completedSteps.includes(stepId)){
                        completedSteps.push(stepId);
                        saveAll();
                        showToast(`✓ Шаг ${stepId} автоматически отмечен!`);
                        if(completedSteps.length === STEPS.length) celebrate();
                    }
                    renderSteps();
                    updateFloatPill();
                    return;
                }
                updateTimerUI(stepId);
                updateFloatPill();
            }
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    /** Восстанавливает реально прошедшее время после перезагрузки — сам расчёт
        по timestamp тут был написан верно, не хватало только перезапуска на старте. */
    function resumeTimers(){
        for(let key in timersState){
            let state = timersState[key];
            if(!state || state.status !== 'running' || !state.timestamp) continue;
            let stepId = parseInt(key);
            let elapsed = Math.floor((Date.now() - state.timestamp)/1000);
            state.seconds = Math.max(0, state.seconds - elapsed);
            if(state.seconds <= 0){
                state.status = 'stopped';
                state.seconds = 0;
                if(allSubstepsDone(stepId) && !completedSteps.includes(stepId)){
                    completedSteps.push(stepId);
                }
            } else {
                state.timestamp = Date.now();
                currentActiveTimerId = stepId;
                runTimerTick(stepId);
            }
        }
        saveAll();
    }

    function stopTimer(stepId){
        let state = timersState[stepId];
        if(!state) return;
        state.status = 'stopped';
        state.seconds = state.total;
        delete state.timestamp;
        if(currentActiveTimerId === stepId) currentActiveTimerId = null;
        saveAll();
        renderSteps();
        updateFloatPill();
        showToast(`Таймер остановлен`);
    }

    /* Полезная фишка из оригинала — можно пропустить таймер раньше, если справился быстрее */
    function skipTimer(stepId){
        let state = timersState[stepId];
        if(!state) return;
        state.status = 'stopped';
        state.seconds = 0;
        delete state.timestamp;
        if(currentActiveTimerId === stepId) currentActiveTimerId = null;
        saveAll();
        playSound();
        renderSteps();
        updateFloatPill();
        showToast(`⏩ Таймер пропущен! Шаг можно отмечать`);
    }

    function updateTimerUI(stepId){
        let state = timersState[stepId];
        if(!state) return;
        let disp = document.querySelector(`[data-timer-display="${stepId}"]`);
        if(disp) disp.textContent = formatTime(state.seconds);
        let fill = document.querySelector(`[data-timer-fill="${stepId}"]`);
        if(fill) fill.style.width = (100 - (state.seconds/state.total*100)).toFixed(1) + '%';
        updateFloatPill();
    }

    /* ============================================ */
    /* === ФОТО БЛЮДА ================================= */
    /* ============================================ */

    function resizeImageFile(file, maxDim, quality){
        return new Promise((resolve, reject)=>{
            let reader = new FileReader();
            reader.onload = (e)=>{
                let img = new Image();
                img.onload = ()=>{
                    let width = img.width, height = img.height;
                    if(width > maxDim || height > maxDim){
                        if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
                        else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
                    }
                    let canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = ()=>reject(new Error('Не удалось декодировать изображение'));
                img.src = e.target.result;
            };
            reader.onerror = ()=>reject(new Error('Не удалось прочитать файл'));
            reader.readAsDataURL(file);
        });
    }

    function savePhotos(){
        try{
            localStorage.setItem('bel_photos', JSON.stringify(photos));
        }catch(e){
            console.error('Ошибка сохранения фото (вероятно, переполнено хранилище):', e);
            photos.pop();
            showToast('⚠️ Не хватило места для фото — удалите старые и попробуйте снова');
        }
    }

    function deletePhoto(id){
        photos = photos.filter(p=>p.id!==id);
        savePhotos();
        renderPhotos();
        showToast('Фото удалено');
    }

    function openLightbox(src){
        let overlay = document.createElement('div');
        overlay.className = 'lightbox';
        let img = document.createElement('img');
        img.src = src;
        img.alt = 'Фото блюда';
        let closeBtn = document.createElement('button');
        closeBtn.className = 'lightbox-close';
        closeBtn.setAttribute('aria-label', 'Закрыть');
        closeBtn.innerHTML = '<i class="fas fa-times"></i>';
        overlay.appendChild(img);
        overlay.appendChild(closeBtn);
        overlay.addEventListener('click', (e)=>{ if(e.target===overlay || e.target.closest('.lightbox-close')) overlay.remove(); });
        document.body.appendChild(overlay);
    }

    function renderPhotos(){
        let strip = document.getElementById('photoStrip');
        let hint = document.getElementById('photoEmptyHint');
        if(!strip) return;

        let html = '';
        photos.forEach(p=>{
            html += `<div class="photo-thumb" data-photo-id="${p.id}"><button class="photo-delete" data-photo-delete="${p.id}" aria-label="Удалить фото"><i class="fas fa-times"></i></button></div>`;
        });
        html += `<label class="photo-add" for="photoInput"><i class="fas fa-plus"></i><span>Добавить</span></label>`;
        strip.innerHTML = html;

        strip.querySelectorAll('.photo-thumb').forEach(el=>{
            let id = el.dataset.photoId;
            let photo = photos.find(p=>p.id===id);
            if(photo) el.style.backgroundImage = `url(${photo.src})`;
            el.addEventListener('click', (e)=>{
                if(e.target.closest('.photo-delete')) return;
                if(photo) openLightbox(photo.src);
            });
        });
        strip.querySelectorAll('[data-photo-delete]').forEach(btn=>{
            btn.addEventListener('click', (e)=>{ e.stopPropagation(); deletePhoto(btn.dataset.photoDelete); });
        });

        if(hint) hint.style.display = photos.length ? 'none' : 'flex';
    }

    /* ============================================ */
    /* === ИНГРЕДИЕНТЫ ================================ */
    /* ============================================ */

    function renderIngredients(){
        let container = document.getElementById('ingredientsContainer');
        let cats = [...new Set(INGREDIENTS_BASE.items.map(i=>i.category))];
        let html = '';
        cats.forEach(cat=>{
            html += `<div class="ing-category">${cat}</div>`;
            INGREDIENTS_BASE.items.filter(i=>i.category===cat).forEach(ing=>{
                let rawAmt = (ing.baseAmount/INGREDIENTS_BASE.basePortions)*portions;
                let f = formatAmount(rawAmt, ing.unit);
                let ch = checkedIngredients.includes(ing.id);
                html += `<div class="ingredient-item ${ch?'checked':''}" data-ing-id="${ing.id}"><input type="checkbox" ${ch?'checked':''}><span class="ingredient-name">${ing.name}</span><span class="ingredient-amount">${f.amount} ${f.unit}</span></div>`;
            });
        });
        container.innerHTML = html;
        document.querySelectorAll('.ingredient-item').forEach(el=>{
            let cb = el.querySelector('input');
            let id = el.dataset.ingId;
            cb.addEventListener('change', ()=>{
                if(cb.checked){ if(!checkedIngredients.includes(id)) checkedIngredients.push(id); el.classList.add('checked'); }
                else{ checkedIngredients = checkedIngredients.filter(i=>i!==id); el.classList.remove('checked'); }
                saveAll();
            });
            el.addEventListener('click', (e)=>{ if(e.target!==cb) cb.click(); });
        });
    }

    function updatePortions(delta){
        let old = portions;
        portions = clampPortions(portions + delta);
        maybeJokeAboutPortions(portions, old);
        document.getElementById('portionsInput').value = portions;
        renderIngredients();
        saveAll();
    }

    /* ============================================ */
    /* === ОТРИСОВКА ШАГОВ ============================ */
    /* ============================================ */

    function renderSteps(){
        let container = document.getElementById('stepsContainer');
        if(!container) return;
        let curGroup = '', html = '';
        let curStep = getCurrentStep();

        STEPS.forEach((step, i)=>{
            if(step.group !== curGroup){ curGroup = step.group; html += `<div class="step-group-title">${step.group}</div>`; }

            let isDone = completedSteps.includes(step.id);
            let isLocked = !isStepAvailable(step) && !isDone;
            let isCurrent = curStep?.id === step.id;
            let timerState = timersState[step.id];
            let isTimerActive = timerState && timerState.status === 'running';
            let substate = substepsState[step.id] || {};
            let isChefActive = isChefMode && i === chefIndex;

            let substepsHtml = '<div class="substeps">';
            step.substeps.forEach((sub, idx)=>{
                let ch = substate[idx] === true;
                substepsHtml += `<div class="substep ${ch?'checked':''}"><input type="checkbox" class="substep-cb" data-step="${step.id}" data-idx="${idx}" ${ch?'checked':''} ${isLocked||isDone?'disabled':''}><span>${sub}</span></div>`;
            });
            substepsHtml += '</div>';

            let timerHtml = '';
            if(step.timer){
                if(isTimerActive){
                    let currSec = timerState.seconds;
                    let pct = (100 - (currSec/timerState.total*100));
                    timerHtml = `<div class="timer-control"><div class="sizzle-wrap">
                        <div class="sizzle-pan"><div class="sizzle-wave" style="animation-delay:0s;"></div><div class="sizzle-wave" style="animation-delay:.8s;"></div></div>
                        <div><span class="timer-time" data-timer-display="${step.id}">${formatTime(currSec)}</span><div class="timer-progress-track"><div class="timer-progress-fill" data-timer-fill="${step.id}" style="width:${pct.toFixed(1)}%"></div></div></div>
                        <button class="timer-icon-btn" data-timer-stop="${step.id}" aria-label="Остановить таймер"><i class="fas fa-stop"></i></button>
                    </div><button class="timer-skip-btn" data-timer-skip="${step.id}"><i class="fas fa-forward"></i> Я быстрее — пропустить</button></div>`;
                } else if(!isDone && !isLocked){
                    timerHtml = `<div class="timer-control"><button class="timer-btn" data-timer-start="${step.id}"><i class="fas fa-hourglass-start"></i> Запустить таймер (${step.timer.label})</button></div>`;
                }
            }

            let cardClasses = `step-card ${isDone?'done':''} ${isLocked?'locked':''} ${isCurrent?'current':''} ${firstStepsRender?'enter':''} ${isChefActive?'chef-active':''}`;
            let cardStyle = firstStepsRender ? `style="animation-delay:${Math.min(i*35,320)}ms"` : '';

            html += `<div class="${cardClasses}" data-step-id="${step.id}" ${cardStyle}>
                <div class="step-content">
                    <div class="step-header">
                        <div class="step-number">${step.id}</div>
                        <div class="step-title">${step.title}</div>
                        ${step.timer ? `<div class="step-timer-badge"><i class="far fa-clock"></i> ${step.timer.label}</div>` : ''}
                        ${isCurrent?'<span class="current-tag">Сейчас</span>':''}
                    </div>
                    <div class="step-desc">${step.desc}</div>
                    ${substepsHtml}
                    ${timerHtml}
                </div>
                <button class="step-done-btn" data-step-toggle="${step.id}" ${isDone||isLocked?'disabled':''}>
                    ${isDone?'<i class="fas fa-check-circle"></i> Готово':'<i class="far fa-check-circle"></i> Отметить выполненным'}
                </button>
            </div>`;
        });

        container.innerHTML = html;
        firstStepsRender = false;

        document.querySelectorAll('[data-step-toggle]').forEach(btn=>btn.addEventListener('click', ()=>toggleStep(parseInt(btn.dataset.stepToggle))));
        document.querySelectorAll('[data-timer-start]').forEach(btn=>btn.addEventListener('click', ()=>{
            let sid = parseInt(btn.dataset.timerStart);
            let s = STEPS.find(s=>s.id===sid);
            if(s?.timer) startTimer(sid, s.timer.duration);
        }));
        document.querySelectorAll('[data-timer-stop]').forEach(btn=>btn.addEventListener('click', ()=>stopTimer(parseInt(btn.dataset.timerStop))));
        document.querySelectorAll('[data-timer-skip]').forEach(btn=>btn.addEventListener('click', ()=>skipTimer(parseInt(btn.dataset.timerSkip))));
        document.querySelectorAll('.substep-cb').forEach(cb=>cb.addEventListener('change', function(){
            updateSubstep(parseInt(this.dataset.step), parseInt(this.dataset.idx), this.checked);
        }));

        updateStatusAndDots();
        updateFloatPill();
        updateChefNav();
    }

    /* ============================================ */
    /* === РЕЖИМ ШЕФ-ПОВАРА (сохранённая полезная фишка) ===== */
    /* ============================================ */

    function updateChefNav(){
        let nav = document.getElementById('chefNav');
        if(!isChefMode){ nav?.remove(); return; }
        if(!nav){
            nav = document.createElement('div');
            nav.className = 'chef-nav';
            nav.id = 'chefNav';
            document.body.appendChild(nav);
        }
        nav.innerHTML = `<button id="chefPrev" ${chefIndex<=0?'disabled':''}><i class="fas fa-arrow-left"></i> Назад</button><span class="chef-counter">Шаг ${chefIndex+1} из ${STEPS.length}</span><button id="chefNext" ${chefIndex>=STEPS.length-1?'disabled':''}>Вперёд <i class="fas fa-arrow-right"></i></button>`;
        document.getElementById('chefPrev').addEventListener('click', ()=>{ if(chefIndex>0){ chefIndex--; renderSteps(); } });
        document.getElementById('chefNext').addEventListener('click', ()=>{ if(chefIndex<STEPS.length-1){ chefIndex++; renderSteps(); } });
    }

    function toggleChefMode(){
        isChefMode = !isChefMode;
        if(isChefMode){
            let cur = getCurrentStep();
            chefIndex = cur ? STEPS.findIndex(s=>s.id===cur.id) : 0;
            document.body.classList.add('chef-mode');
        } else {
            document.body.classList.remove('chef-mode');
        }
        renderSteps();
    }

    /* ============================================ */
    /* === СБРОС ======================================= */
    /* ============================================ */

    function resetAll(){
        if(confirm('🥟 Сбросить весь прогресс приготовления?')){
            completedSteps=[]; checkedIngredients=[]; substepsState={}; timersState={};
            currentActiveTimerId=null; portions=INGREDIENTS_BASE.basePortions;
            document.getElementById('portionsInput').value = portions;
            saveAll();
            renderIngredients();
            renderSteps();
            updateFloatPill();
            document.getElementById('shareBtn').style.display = 'none';
            showToast('Прогресс сброшен');
        }
    }

    /* ============================================ */
    /* === ТЁМНАЯ ТЕМА ================================= */
    /* ============================================ */

    function applyTheme(){
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }

    /* ============================================ */
    /* === WAKE LOCK =================================== */
    /* ============================================ */

    function initWakeLock(){
        let btn = document.getElementById('wakeLockBtn');
        if(!('wakeLock' in navigator)){ btn.style.display = 'none'; return; }
        btn.addEventListener('click', async ()=>{
            if(!wakeLock){
                try{
                    wakeLock = await navigator.wakeLock.request('screen');
                    btn.classList.add('active');
                    btn.innerHTML = '<i class="fas fa-check"></i> Экран активен';
                    wakeLock.addEventListener('release', ()=>{
                        wakeLock = null;
                        btn.classList.remove('active');
                        btn.innerHTML = '<i class="fas fa-sun"></i> Экран не гаснет';
                    });
                }catch(e){ showToast('Не удалось активировать'); }
            } else {
                wakeLock.release();
            }
        });
    }

    /* ============================================ */
    /* === ИНИЦИАЛИЗАЦИЯ ================================ */
    /* ============================================ */

    function init(){
        applyTheme();
        let wasReset = checkAutoReset();

        document.getElementById('portionsInput').value = portions;
        if(!wasReset) resumeTimers();

        renderIngredients();
        renderSteps();
        renderPhotos();

        document.getElementById('photoInput').addEventListener('change', async function(){
            let files = Array.from(this.files || []);
            for(let file of files){
                if(!file.type.startsWith('image/')) continue;
                try{
                    let dataUrl = await resizeImageFile(file, 1200, 0.82);
                    photos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), src: dataUrl });
                }catch(e){
                    console.error('Ошибка обработки фото:', e);
                    showToast('⚠️ Не удалось обработать одно из фото');
                }
            }
            savePhotos();
            renderPhotos();
            this.value = '';
        });

        document.getElementById('portMinus').addEventListener('click', ()=>updatePortions(-1));
        document.getElementById('portPlus').addEventListener('click', ()=>updatePortions(1));
        document.getElementById('portionsInput').addEventListener('change', function(){
            let old = portions;
            portions = clampPortions(parseInt(this.value));
            maybeJokeAboutPortions(portions, old);
            this.value = portions;
            renderIngredients();
            saveAll();
        });

        document.getElementById('resetBtn').addEventListener('click', resetAll);
        document.getElementById('chefModeBtn').addEventListener('click', toggleChefMode);
        document.getElementById('shareBtn').addEventListener('click', ()=>{
            if(navigator.share) navigator.share({ title:'Те самые беляши', text:'Я приготовил сочные беляши по этому рецепту! Пальчики оближешь!', url: window.location.href });
            else showToast('Скопируйте ссылку из адресной строки, чтобы поделиться');
        });

        document.getElementById('startBtn').addEventListener('click', ()=>{
            let cur = getCurrentStep();
            let target = cur ? document.querySelector(`.step-card[data-step-id="${cur.id}"]`) : document.querySelector('.footer');
            target?.scrollIntoView({behavior:'smooth', block:'center'});
        });

        document.getElementById('scrollTop').addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));
        document.getElementById('scrollTop').addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); window.scrollTo({top:0, behavior:'smooth'}); } });
        document.getElementById('fpStop').addEventListener('click', (e)=>{ e.stopPropagation(); if(currentActiveTimerId) stopTimer(currentActiveTimerId); });

        document.getElementById('themeBtn').addEventListener('click', ()=>{
            isDark = !isDark;
            localStorage.setItem('bel_theme', isDark ? 'dark' : 'light');
            applyTheme();
        });

        window.addEventListener('scroll', ()=>{
            document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 200);
        });

        initWakeLock();
    }

    document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
